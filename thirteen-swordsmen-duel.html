// ===================== 音效(用程式做出來,不用任何音檔) =====================
let 音 = null, 靜音 = false, 噪音 = null;
function 開音效() {
  try {
    if (!音) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      音 = new AC();
      噪音 = 音.createBuffer(1, 音.sampleRate, 音.sampleRate);
      const d = 噪音.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (音.state === 'suspended') 音.resume();
  } catch (e) { 音 = null; }
}
// 嗶一聲:頻率、長度、波形、音量、滑到哪個頻率、延遲幾秒
function 嗶(freq, dur, type, vol, slideTo, delay) {
  if (!音 || 靜音) return;
  try {
    const t = 音.currentTime + (delay || 0);
    const o = 音.createOscillator(), g = 音.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(音.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
// 沙沙聲(揮劍、風、浪)
function 沙(dur, vol, 從, 到, delay) {
  if (!音 || 靜音 || !噪音) return;
  try {
    const t = 音.currentTime + (delay || 0);
    const s = 音.createBufferSource(), f = 音.createBiquadFilter(), g = 音.createGain();
    s.buffer = 噪音; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(從 || 800, t);
    f.frequency.exponentialRampToValueAtTime(到 || 3000, t + dur);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(音.destination);
    s.start(t); s.stop(t + dur + 0.05);
  } catch (e) {}
}

// ===================== 密碼(存進度用) =====================
function 產生密碼() {
  const n = (解鎖數 - 5) * 5 + (顏色數 - 1), a = n + 17;
  const d3 = (n * 7 + 3) % 10, d4 = (n * 3 + d3 + 1) % 10;
  return '' + Math.floor(a / 10) + (a % 10) + d3 + d4;
}
function 檢查密碼(s) {
  if (!/^\d{4}$/.test(s)) return false;
  const n = parseInt(s.slice(0, 2), 10) - 17;
  if (n < 0 || n > (解鎖上限 - 5) * 5 + 4) return false;
  const d3 = (n * 7 + 3) % 10, d4 = (n * 3 + d3 + 1) % 10;
  if (+s[2] !== d3 || +s[3] !== d4) return false;
  解鎖數 = Math.floor(n / 5) + 5; 顏色數 = n % 5 + 1; return true;
}

  if (c.indexOf('Numpad') === 0 && c.length === 7) return c.slice(6);
  if (c === 'Space') return ' ';
  if (c === 'Enter' || c === 'NumpadEnter') return 'Enter';
  if (c === 'Escape' || c === 'Backspace') return c;

// ===================== 畫圖小工具 =====================
function 圓角(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);

}
function 字(t, x, y, size, color, align, weight, 描邊) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px ' + 字型;

  if (描邊) { ctx.lineWidth = 描邊; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color || '#fff'; ctx.fillText(t, x, y);

function 按鈕(x, y, w, h, label, act, opt) {
  opt = opt || {};
  const hover = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  圓角(x, y, w, h, 12);
  ctx.fillStyle = opt.off ? 'rgba(60,55,75,.7)' : (opt.主 ? '#f5b335' : (hover ? '#3a3352' : 'rgba(30,26,42,.92)'));
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = opt.off ? '#555' : (opt.主 ? '#ffd27a' : (hover ? '#f5b335' : '#4a4266')); ctx.stroke();
  字(label, x + w / 2, y + h / 2 + 1, opt.size || 18, opt.off ? '#8a8496' : (opt.主 ? '#1c1405' : '#f4ecdd'));
  btns.push({ x, y, w, h, act, off: opt.off });
}
function 提示(t) {

  for (let k = 0; k < 7; k++) { ctx.save(); ctx.rotate(-0.6 + k * 0.2); ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#d8b04a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(24, 0, 20, 3.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.fillStyle = '#e0a52a'; ctx.fillRect(-6, -3, 10, 6); ctx.beginPath(); ctx.arc(-6, 0, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c8e04a'; ctx.fillRect(-9, 3, 4, 10); ctx.fillRect(-4, 3, 4, 9);

// 休閒劍士:黑色亂髮、開襟外套、喇叭褲、拖鞋(口罩、眨眼、格子可以開關)
function 畫休閒劍士(d, 衣, pose, bob, 步) {

  });

// 地板上的立體橫線,讓地板看起來斜斜的
function 地板線() {

function 能動(f) { return f.freeze <= 0 && f.stun <= 0; }

// 從 f 看 op:距離和方向
function 看(f, op) { const dx = op.x - f.x, dz = op.z - f.z, dist = Math.hypot(dx, dz) || 0.001; return { dx, dz, dist, ux: dx / dist, uz: dz / dist }; }
function 出招(f) {
  f.hitDone = false; f.dashT = 0;
  if (!在地上(f)) {                       // 空中攻擊:往下劈
    f.atkKind = 'air'; f.atkLen = 0.32; f.atkT = 0.32; f.atkCD = 0.45;
    f.vh = Math.min(f.vh, 0) - 380; 音效.揮(); return;
  }
  f.combo = f.comboT > 0 && f.combo < 3 ? f.combo + 1 : 1;   // 三連擊
  f.comboT = 0;
  f.atkKind = f.combo === 3 ? 'combo3' : 'normal';
  f.atkLen = f.combo === 3 ? 0.36 : SETTINGS.攻擊時間;
  f.atkT = f.atkLen; f.atkCD = f.combo === 3 ? 0.55 : 0.3;

}
function 衝刺(f, dx, dz) {
  if (f.dashCD > 0 || !在地上(f) || f.atkT > 0) return;
  const L = Math.hypot(dx, dz) || 1;
  f.dashT = 0.2; f.dashCD = 0.6; f.dashX = dx / L; f.dashZ = dz / L; 音效.衝();
}
function 打中(t, dmg, src, isUlt, freeze, 種) {

  let blocked = false;
  if (t.guard) { blocked = true; dmg = isUlt ? dmg / 2 : 0; }
  const v = 看(src, t);
  if (dmg > 0) {
    t.hp = Math.max(0, t.hp - dmg);
    const 飛 = 種 === 'combo3';
    t.stun = isUlt ? 0.55 : 飛 ? 0.45 : 種 === 'air' ? 0.35 : 0.22; t.atkT = 0; t.flash = 0.15;
    const k = isUlt ? 420 : 飛 ? 560 : 260;

  if (scene === 'pickStage' || scene === 'pickDiff' || scene === 'adPick') {
    const n = scene === 'pickStage' ? 場地們.length : scene === 'pickDiff' ? 3 : 2;
    if (pressed.a) 游標 = Math.max(0, 游標 - 1);
    if (pressed.d) 游標 = Math.min(n - 1, 游標 + 1);
    if (scene === 'pickStage' && pressed.w) 游標 = Math.max(0, 游標 - 3);
    if (scene === 'pickStage' && pressed.s) 游標 = Math.min(n - 1, 游標 + 3);
  }
  if (scene === 'adPick' && 確) {
    if (游標 === 0 && 解鎖數 < 解鎖上限) 開始廣告('unlock');
    else if (游標 === 1 && 顏色數 < SETTINGS.顏色最多) 開始廣告('color');
    else 吐司('這個已經全部拿到了!');
    return;
  }
  if (['pickP', 'pickE', 'pickStage', 'pickDiff'].indexOf(scene) >= 0 && 確) { 確定選擇(); return; }
  if (['pickP', 'pickE', 'pickStage', 'pickDiff', 'adPick'].indexOf(scene) >= 0 && 退) { 返回(); return; }
  if (scene === 'code') {
    for (let n = 0; n <= 9; n++) if (pressed['' + n]) 密碼按('' + n);
    if (pressed.Backspace) 密碼按('⌫');
    if (pressed.Enter) 密碼按('✔');
    if (pressed.Escape) 返回();
  }
  if (scene === 'ad' && 廣告.t >= SETTINGS.廣告秒數 && 確) 領取獎勵();
  if (scene === 'victory' && 場景時間 > 0.8 && 確) 勝利動畫結束();
  if (scene === 'unlockAnim' && 場景時間 > 1 && 確) 解鎖動畫結束();
  if (scene === 'result' && 場景時間 > 0.3) { if (確) 開始比賽(); else if (退) 換場景('pickP'); }
}

// ===================== 主迴圈 =====================
function 更新(dt) {
  時間 += dt; 場景時間 += dt;
  if (toast.t > 0) toast.t -= dt;
  if (scene === 'fight') 更新戰鬥(dt);
  else {
    if (scene === 'ad') {
      廣告.t += dt;
      const 拍 = Math.floor(廣告.t * 4);
      if (廣告.t < SETTINGS.廣告秒數 && 拍 !== 廣告拍) { 廣告拍 = 拍; 嗶(廣告曲[拍 % 廣告曲.length], 0.18, 'triangle', 0.05); }
    }
    if (scene === 'victory') 彩帶.forEach(c => { c.y += c.v * dt; if (c.y > H + 20) c.y = -20; });
    選單鍵盤();
  }
  pressed = {};
}
function 畫() {
  btns = [];
  ctx.clearRect(0, 0, W, H);
  if (scene === 'title') 畫標題();
  else if (scene === 'pickP') 畫選角();
  else if (scene === 'pickE') 畫選對手();
  else if (scene === 'pickStage') 畫選場地();
  else if (scene === 'pickDiff') 畫選難度();
  else if (scene === 'fight') 畫戰鬥();
  else if (scene === 'adPick') 畫廣告選擇();
  else if (scene === 'ad') 畫廣告();
  else if (scene === 'code') 畫密碼();
  else if (scene === 'victory') 畫勝利();
  else if (scene === 'unlockAnim') 畫解鎖();
  else if (scene === 'result') 畫結果();
  if (toast.t > 0) {
    ctx.globalAlpha = Math.min(1, toast.t * 3);
    ctx.fillStyle = 'rgba(0,0,0,.8)'; 圓角(W / 2 - 200, 64, 400, 40, 12); ctx.fill();
    字(toast.text, W / 2, 84, 17, '#fff'); ctx.globalAlpha = 1;
  }
  三D.顯示(scene === 'fight' || scene === 'victory');
  const 要按鈕 = scene === 'fight';
  if (pad.hidden === 要按鈕) pad.hidden = !要按鈕;
}
let 上次 = 0, 幀dt = 1 / 60;
function loop(now) {
  const dt = Math.min(0.033, Math.max(0, (now - (上次 || now)) / 1000));
  幀dt = dt || 1 / 60;
  上次 = now;
  更新(dt); 畫();
  requestAnimationFrame(loop);
}
取得焦點();
requestAnimationFrame(loop);
</script>
