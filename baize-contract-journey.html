// ===================== 基本設定 =====================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const HUD = 70;                       // 上方計分區高度

let state = 'start';                  // start / playing / clear / win / lose
let 關卡 = 1, 命 = SETTINGS.命, 關分 = 0, 總分 = 0;
let 用過鍵盤 = false;
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false, dir: 0 };
let 目前關 = null;                    // 現在正在玩的關卡物件

// ---- 小工具 ----
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function 畫字(t, x, y, size, color, align) {
  ctx.font = 'bold ' + size + 'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.fillStyle = color || SETTINGS.色.字; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}
function 畫emoji(t, x, y, size) {
  ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(t, x, y);
}
// 把角色圖片畫在「腳底在 (x, bottom)」的位置，高度 h
function 畫角色(img, x, bottom, h, alpha) {
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  if (img.complete && img.naturalWidth > 0) {
    const w = h * img.naturalWidth / img.naturalHeight;
    ctx.drawImage(img, x - w / 2, bottom - h, w, h);
  } else { 畫emoji('🧒', x, bottom - h / 2, h * 0.8); }   // 圖片還沒好就先用 emoji
  ctx.restore();
}
function 畫雲(x, y, w, h) {   // 平台和板子都是雲朵
  ctx.fillStyle = SETTINGS.色.雲影; ctx.beginPath(); ctx.roundRect(x, y + 3, w, h, h / 2); ctx.fill();
  ctx.fillStyle = SETTINGS.色.雲; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
  for (let i = 0; i < w; i += 34) { ctx.beginPath(); ctx.arc(x + i + 17, y + 2, 12, 0, Math.PI * 2); ctx.fill(); }
}
function 畫星空(offset) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, SETTINGS.色.夜空); g.addColorStop(1, SETTINGS.色.夜空2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 40; i++) {           // 固定位置的小星星
    const sx = ((i * 197 + 31) - (offset || 0) * 0.3) % W, sy = (i * 83 + 17) % H;
    ctx.fillRect((sx + W) % W, sy, 2, 2);
  }
}
function 失去一命() {
  命--; if (命 <= 0) { 命 = 0; state = 'lose'; }
}
function 得分() {
  關分++; 總分++;
  if (關分 >= SETTINGS.每關目標) state = (關卡 >= SETTINGS.關卡數) ? 'win' : 'clear';
}

// ===================== 第 1 關：迷宮 =====================
function 建迷宮() {
  const S = SETTINGS.迷宮, C = S.欄, R = S.列, cell = S.格子;
  const ox = (W - C * cell) / 2, oy = HUD + (H - HUD - R * cell) / 2;
  const grid = []; for (let r = 0; r < R; r++) { grid.push([]); for (let c = 0; c < C; c++) grid[r].push(1); }
  // 用「隨機挖路」做迷宮：從 (1,1) 開始，每次跳兩格
  const stack = [[1, 1]]; grid[1][1] = 0;
  while (stack.length) {
    const [r, c] = stack[stack.length - 1];
    const opts = [[0, 2], [0, -2], [2, 0], [-2, 0]].filter(([dr, dc]) => {
      const nr = r + dr, nc = c + dc; return nr > 0 && nr < R - 1 && nc > 0 && nc < C - 1 && grid[nr][nc] === 1;
    });
    if (!opts.length) { stack.pop(); continue; }
    const [dr, dc] = opts[rndi(0, opts.length - 1)];
    grid[r + dr / 2][c + dc / 2] = 0; grid[r + dr][c + dc] = 0; stack.push([r + dr, c + dc]);
  }
  // 多打通幾面牆，讓迷宮有圈圈可以繞，妖怪才不會把路堵死
  let extra = 14;
  while (extra > 0) {
    const r = rndi(1, R - 2), c = rndi(1, C - 2);
    if (grid[r][c] !== 1) continue;
    const h = grid[r][c - 1] === 0 && grid[r][c + 1] === 0, v = grid[r - 1][c] === 0 && grid[r + 1][c] === 0;
    if (h || v) { grid[r][c] = 0; extra--; }
  }
  const open = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (!grid[r][c] && !(r === 1 && c === 1)) open.push([r, c]);
  const 是牆 = (r, c) => r < 0 || c < 0 || r >= R || c >= C || grid[r][c] === 1;
  const 中心 = (r, c) => [ox + c * cell + cell / 2, oy + r * cell + cell / 2];
  const 格 = (x, y) => [Math.floor((y - oy) / cell), Math.floor((x - ox) / cell)];
  // 小豆的碰撞框 24×30，檢查四個角有沒有碰到石頭
  const PW = 22, PH = 28;
  const 撞牆 = (x, y) => [[-PW / 2, -PH / 2], [PW / 2, -PH / 2], [-PW / 2, PH / 2], [PW / 2, PH / 2]]
    .some(([dx, dy]) => { const [r, c] = 格(x + dx, y + dy); return 是牆(r, c); });
  // 廣度優先找路（滑鼠點哪裡就走哪裡用的）
  function 找路(from, to) {
    const prev = {}; const q = [from]; const key = p => p[0] + ',' + p[1]; prev[key(from)] = null;
    while (q.length) {
      const cur = q.shift(); if (cur[0] === to[0] && cur[1] === to[1]) break;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = [cur[0] + dr, cur[1] + dc]; if (是牆(n[0], n[1]) || key(n) in prev) continue;
        prev[key(n)] = cur; q.push(n);
      }
    }
    if (!(key(to) in prev)) return null;
    const path = []; let p = to; while (p) { path.unshift(p); p = prev[key(p)]; } return path;
  }
  const L = { grid, ox, oy, cell, C, R, 中心, 找路, 撞牆, 格, open };
  const [sx, sy] = 中心(1, 1);
  L.p = { x: sx, y: sy, 無敵: 0, target: null };
  // 神話之靈：隨機放 20 個
  const shuffled = open.slice().sort(() => Math.random() - 0.5);
  L.stars = shuffled.slice(0, S.神靈數).map(([r, c]) => { const [x, y] = 中心(r, c); return { x, y, r, c }; });
  // 妖怪：放在離起點遠的格子
  const far = open.filter(([r, c]) => Math.abs(r - 1) + Math.abs(c - 1) >= 8).sort(() => Math.random() - 0.5);
  L.monsters = far.slice(0, S.妖怪數).map(([r, c]) => { const [x, y] = 中心(r, c); return { x, y, r, c, dir: [0, 1], tr: r, tc: c }; });
  L.白泽格 = [R - 2, C - 2];

  L.update = function () {
    const p = L.p, spd = S.小豆速度;
    if (p.無敵 > 0) p.無敵 -= 1 / 60;
    // ---- 鍵盤 ----
    let dx = 0, dy = 0;
    if (keys.a || keys.ArrowLeft) dx -= 1; if (keys.d || keys.ArrowRight) dx += 1;
    if (keys.w || keys.ArrowUp) dy -= 1; if (keys.s || keys.ArrowDown) dy += 1;
    if (dx || dy) p.target = null;
    // ---- 滑鼠：沿著找到的路一格一格走 ----
    if (!dx && !dy && p.target) {
      const me = 格(p.x, p.y); const path = 找路(me, p.target);
      if (!path || path.length <= 1) {
        const [tx, ty] = 中心(p.target[0], p.target[1]);
        if (Math.hypot(tx - p.x, ty - p.y) < 3) p.target = null; else { dx = Math.sign(tx - p.x); dy = Math.sign(ty - p.y); }
      } else {
        const [tx, ty] = 中心(path[1][0], path[1][1]);
        dx = Math.abs(tx - p.x) > 2 ? Math.sign(tx - p.x) : 0; dy = Math.abs(ty - p.y) > 2 ? Math.sign(ty - p.y) : 0;
      }
    }
    // 先走 x 再走 y，撞到石頭就不動
    let nx = p.x + dx * spd; if (!撞牆(nx, p.y)) p.x = nx;
    let ny = p.y + dy * spd; if (!撞牆(p.x, ny)) p.y = ny;
    p.x = clamp(p.x, ox + 20, ox + C * cell - 20); p.y = clamp(p.y, oy + 20, oy + R * cell - 20);
    // ---- 撿神話之靈 ----
    for (let i = L.stars.length - 1; i >= 0; i--) {
      if (Math.hypot(L.stars[i].x - p.x, L.stars[i].y - p.y) < 20) { L.stars.splice(i, 1); 得分(); }
    }
    // ---- 妖怪在通道裡亂走 ----
    for (const m of L.monsters) {
      const [tx, ty] = 中心(m.tr, m.tc);
      const d = Math.hypot(tx - m.x, ty - m.y);
      if (d <= S.妖怪速度) {           // 到了格子中心，挑下一格
        m.x = tx; m.y = ty; m.r = m.tr; m.c = m.tc;
        const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dr, dc]) => !是牆(m.r + dr, m.c + dc));
        const noBack = opts.filter(([dr, dc]) => !(dr === -m.dir[0] && dc === -m.dir[1]));
        const pick = (noBack.length ? noBack : opts)[rndi(0, (noBack.length ? noBack : opts).length - 1)];
        m.dir = pick; m.tr = m.r + pick[0]; m.tc = m.c + pick[1];
      } else { m.x += (tx - m.x) / d * S.妖怪速度; m.y += (ty - m.y) / d * S.妖怪速度; }
      if (p.無敵 <= 0 && Math.hypot(m.x - p.x, m.y - p.y) < 26) {
        失去一命(); p.無敵 = S.無敵秒; p.x = sx; p.y = sy; p.target = null;
      }
    }
  };
  L.pointerDown = function (x, y) {
    const [r, c] = 格(x, y);
    if (!是牆(r, c)) L.p.target = [r, c];
  };
  L.draw = function () {
    畫星空(0);
    // 石頭牆
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (grid[r][c]) {
      const x = ox + c * cell, y = oy + r * cell;
      ctx.fillStyle = SETTINGS.色.石; ctx.beginPath(); ctx.roundRect(x + 2, y + 2, cell - 4, cell - 4, 9); ctx.fill();
      ctx.fillStyle = SETTINGS.色.石亮; ctx.beginPath(); ctx.roundRect(x + 7, y + 6, cell - 18, 8, 4); ctx.fill();
    }
    if (L.p.target) { const [tx, ty] = 中心(L.p.target[0], L.p.target[1]); ctx.strokeStyle = SETTINGS.色.金; ctx.lineWidth = 2; ctx.strokeRect(tx - 14, ty - 14, 28, 28); }
    for (const s of L.stars) 畫emoji('⭐', s.x, s.y, 24);
    const [br, bc] = L.白泽格; const [bx, by] = 中心(br, bc); 畫角色(IMG_白泽, bx, by + 18, 38);
    for (const m of L.monsters) 畫emoji('👹', m.x, m.y, 28);
    const p = L.p; 畫角色(IMG_小豆, p.x, p.y + 18, 38, p.無敵 > 0 && Math.floor(p.無敵 * 10) % 2 ? 0.35 : 1);
  };
  L.鍵提示 = 'WASD 走路，撿滿 ⭐ 找到白泽！'; L.鼠提示 = '👆 鍵盤沒反應？點一下畫面，或直接點迷宮裡要去的地方';
  return L;
}

// ===================== 第 2 關：跳跳平台 =====================
function 建平台() {
  const S = SETTINGS.平台;
  const L = {};
  // 一排雲朵平台，每一段間隔都保證跳得過去
  const plats = [{ x: 0, y: 470, w: 280 }];
  for (let i = 0; i < S.神靈數 + 1; i++) {
    const prev = plats[plats.length - 1];
    const gap = rndi(60, 105), w = rndi(130, 220);
    let y = prev.y + rndi(-75, 70); y = clamp(y, 210, 470);
    plats.push({ x: prev.x + prev.w + gap, y, w });
  }
  const last = plats[plats.length - 1]; last.w = 300;
  L.plats = plats; L.worldW = last.x + last.w;
  L.stars = []; for (let i = 1; i <= S.神靈數; i++) { const p = plats[i]; L.stars.push({ x: p.x + p.w / 2, y: p.y - 55 }); }
  L.monsters = []; const idx = [5, 9, 13, 17];
  for (let i = 0; i < S.妖怪數; i++) { const p = plats[idx[i]]; L.monsters.push({ p, x: p.x + 10, dir: 1 }); }
  L.pl = { x: 60, y: 470 - 60, w: 30, h: 60, vx: 0, vy: 0, ground: false, 無敵: 0, last: plats[0] };
  L.cam = 0;
  const 跳 = () => { if (L.pl.ground) { L.pl.vy = S.跳力; L.pl.ground = false; } };
  L.update = function () {
    const p = L.pl;
    if (p.無敵 > 0) p.無敵 -= 1 / 60;
    let dir = 0;
    if (keys.a || keys.ArrowLeft) dir = -1; if (keys.d || keys.ArrowRight) dir = 1;
    if (!dir) dir = mouse.dir;
    if (keys.w || keys.ArrowUp || keys[' ']) 跳();
    p.x += dir * S.走速; p.x = clamp(p.x, 0, L.worldW - p.w);
    p.vy += S.重力; const prevBottom = p.y + p.h; p.y += p.vy; p.ground = false;
    if (p.vy >= 0) for (const pl of plats) {
      if (p.x + p.w > pl.x && p.x < pl.x + pl.w && prevBottom <= pl.y + 1 && p.y + p.h >= pl.y) {
        p.y = pl.y - p.h; p.vy = 0; p.ground = true; p.last = pl;
      }
    }
    if (p.y > H + 40) {              // 掉下去
      失去一命(); p.x = p.last.x + 10; p.y = p.last.y - p.h; p.vy = 0; p.無敵 = S.無敵秒;
    }
    for (let i = L.stars.length - 1; i >= 0; i--) {
      const s = L.stars[i]; if (Math.abs(s.x - (p.x + p.w / 2)) < 28 && Math.abs(s.y - (p.y + p.h / 2)) < 40) { L.stars.splice(i, 1); 得分(); }
    }
    for (const m of L.monsters) {
      m.x += m.dir * S.妖怪速度; if (m.x < m.p.x || m.x > m.p.x + m.p.w - 30) m.dir *= -1;
      const mx = m.x + 15, my = m.p.y - 16;
      if (p.無敵 <= 0 && Math.abs(mx - (p.x + p.w / 2)) < 30 && Math.abs(my - (p.y + p.h / 2)) < 40) { 失去一命(); p.無敵 = S.無敵秒; }
    }
    L.cam = clamp(p.x - 300, 0, L.worldW - W);
  };
  L.pointerDown = function (x, y) {
    if (y < H * 0.45) 跳(); else mouse.dir = x < W / 2 ? -1 : 1;
  };
  L.draw = function () {
    畫星空(L.cam);
    ctx.save(); ctx.translate(-L.cam, 0);
    for (const pl of plats) 畫雲(pl.x, pl.y, pl.w, 16);
    for (const s of L.stars) 畫emoji('⭐', s.x, s.y, 26);
    for (const m of L.monsters) 畫emoji('👹', m.x + 15, m.p.y - 16, 30);
    const lp = plats[plats.length - 1]; 畫角色(IMG_白泽, lp.x + lp.w - 80, lp.y, 90);
    畫emoji('🚩', lp.x + lp.w - 150, lp.y - 20, 30);
    const p = L.pl; 畫角色(IMG_小豆, p.x + p.w / 2, p.y + p.h, p.h, p.無敵 > 0 && Math.floor(p.無敵 * 10) % 2 ? 0.35 : 1);
    ctx.restore();
  };
  L.鍵提示 = 'A/D 走，W 跳，撿滿 ⭐ 就過關！'; L.鼠提示 = '👆 鍵盤沒反應？點畫面上半＝跳，點左邊/右邊＝走';
  return L;
}

// ===================== 第 3 關：打磚塊 =====================
function 建磚塊() {
  const S = SETTINGS.磚塊;
  const L = {};
  const bw = 120, bh = 34, gapx = 12, gapy = 12;
  const totalW = S.磚欄 * bw + (S.磚欄 - 1) * gapx, x0 = (W - totalW) / 2, y0 = HUD + 30;
  const colors = ['#e76f8a', '#f2a65a', '#6ec0f0', '#8fd18a'];
  L.bricks = []; for (let r = 0; r < S.磚列; r++) for (let c = 0; c < S.磚欄; c++)
    L.bricks.push({ x: x0 + c * (bw + gapx), y: y0 + r * (bh + gapy), w: bw, h: bh, color: colors[r % colors.length] });
  L.pad = { x: W / 2 - S.板寬 / 2, y: H - 60, w: S.板寬, h: 16 };
  L.ball = { x: 0, y: 0, vx: 0, vy: 0, r: 9, stuck: true };
  L.update = function () {
    const pad = L.pad, b = L.ball;
    if (keys.a || keys.ArrowLeft) pad.x -= S.板速; if (keys.d || keys.ArrowRight) pad.x += S.板速;
    if (mouse.moved) { pad.x = mouse.x - pad.w / 2; mouse.moved = false; }
    pad.x = clamp(pad.x, 0, W - pad.w);
    if (b.stuck) {
      b.x = pad.x + pad.w / 2; b.y = pad.y - b.r - 1;
      if (keys.w || keys[' '] || keys.ArrowUp) L.發射();
      return;
    }
    b.x += b.vx; b.y += b.vy;
    if (b.x < b.r) { b.x = b.r; b.vx *= -1; } if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -1; }
    if (b.y < HUD + b.r) { b.y = HUD + b.r; b.vy *= -1; }
    // 碰到雲朵板子：打在越邊邊，飛得越斜
    if (b.vy > 0 && b.y + b.r >= pad.y && b.y - b.r <= pad.y + pad.h && b.x >= pad.x - b.r && b.x <= pad.x + pad.w + b.r) {
      const t = clamp((b.x - (pad.x + pad.w / 2)) / (pad.w / 2), -1, 1);
      let ang = t * Math.PI / 3;         // 最多 60 度
      if (Math.abs(ang) < 0.25) ang = (Math.random() < .5 ? -1 : 1) * rnd(0.25, 0.5);   // 不讓球一直直上直下
      b.vx = Math.sin(ang) * S.球速; b.vy = -Math.cos(ang) * S.球速; b.y = pad.y - b.r - 1;
    }
    // 碰到磚塊
    for (let i = L.bricks.length - 1; i >= 0; i--) {
      const k = L.bricks[i];
      if (b.x + b.r > k.x && b.x - b.r < k.x + k.w && b.y + b.r > k.y && b.y - b.r < k.y + k.h) {
        const ox = Math.min(b.x + b.r - k.x, k.x + k.w - (b.x - b.r)), oy = Math.min(b.y + b.r - k.y, k.y + k.h - (b.y - b.r));
        if (ox < oy) b.vx *= -1; else b.vy *= -1;
        L.bricks.splice(i, 1); 得分(); break;
      }
    }
    if (b.y > H + 20) { 失去一命(); b.stuck = true; }   // 球掉了
  };
  L.發射 = function () { const b = L.ball; if (!b.stuck) return; b.stuck = false; b.vx = (Math.random() < .5 ? -1 : 1) * S.球速 * 0.5; b.vy = -S.球速 * 0.87; };
  L.pointerDown = function (x, y) { L.發射(); };
  L.draw = function () {
    畫星空(0);
    for (const k of L.bricks) {
      ctx.fillStyle = k.color; ctx.beginPath(); ctx.roundRect(k.x, k.y, k.w, k.h, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
      畫emoji('👹', k.x + k.w / 2, k.y + k.h / 2 + 1, 22);
    }
    const pad = L.pad; 畫雲(pad.x, pad.y, pad.w, pad.h);
    畫角色(IMG_小豆, pad.x + pad.w / 2, pad.y + 2, 56);
    const b = L.ball;   // 符咒球
    ctx.fillStyle = SETTINGS.色.金; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    if (b.stuck) 畫字('點畫面或按 W 發射符咒球', W / 2, pad.y - 80, 18, SETTINGS.色.金);
  };
  L.鍵提示 = 'A/D 移動雲朵，把 20 塊封印磚全部打碎！'; L.鼠提示 = '👆 鍵盤沒反應？滑鼠左右移動就能控制雲朵';
  return L;
}

// ===================== 關卡切換 / 開始 / 重玩 =====================
const 建關 = [建迷宮, 建平台, 建磚塊];
function 開始關卡(n) {
  關卡 = n; 關分 = 0; mouse.dir = 0; mouse.moved = false;
  for (const k in keys) keys[k] = false;
  目前關 = 建關[n - 1](); state = 'playing';
}
function 重新開始() { 命 = SETTINGS.命; 總分 = 0; 開始關卡(1); }
function 下一步() {        // 不在遊戲中時，按鍵或點畫面都會呼叫這個
  if (state === 'start' || state === 'lose' || state === 'win') 重新開始();
  else if (state === 'clear') 開始關卡(關卡 + 1);
}

// ===================== 畫面 =====================
function 畫HUD() {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, HUD);
  畫字('第 ' + 關卡 + ' 關  ' + SETTINGS.關名[關卡 - 1], 20, 26, 20, SETTINGS.色.金, 'left');
  畫字('⭐ ' + 關分 + ' / ' + SETTINGS.每關目標, W / 2, 26, 22, '#fff');
  畫字('總分 ' + 總分, W / 2, 52, 14, 'rgba(255,255,255,.7)');
  let hearts = ''; for (let i = 0; i < SETTINGS.命; i++) hearts += i < 命 ? '❤️' : '🤍';
  畫emoji(hearts, W - 20 - SETTINGS.命 * 12, 28, 20);
}
function 畫開始() {
  畫星空(0);
  畫字('白泽契約之旅', W / 2, 70, 44, SETTINGS.色.金);
  畫字('小豆穿越三千世界收服神話之靈', W / 2, 118, 20);
  畫角色(IMG_小豆, 150, 400, 220); 畫角色(IMG_白泽, 650, 400, 230);
  const lines = ['🌀 第 1 關：迷宮裡撿 20 顆 ⭐，躲開 👹', '🦘 第 2 關：跳過雲朵撿 20 顆 ⭐', '🧱 第 3 關：打碎 20 塊封印磚', '❤️ 三關共用 5 條命'];
  lines.forEach((t, i) => 畫字(t, W / 2, 190 + i * 40, 20));
  畫字('點一下畫面 或 按空白鍵 開始！', W / 2, 460, 24, SETTINGS.色.金);
}
function 畫對話(標題, 台詞, 底下) {
  ctx.fillStyle = 'rgba(10,12,40,.82)'; ctx.fillRect(0, 0, W, H);
  畫角色(IMG_白泽, 170, 440, 250);
  畫字(標題, 500, 120, 32, SETTINGS.色.金);
  // 對話框
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(300, 170, 460, 130, 22); ctx.fill();
  ctx.beginPath(); ctx.moveTo(300, 250); ctx.lineTo(268, 270); ctx.lineTo(300, 275); ctx.fill();
  畫字('白泽：', 330, 205, 18, '#333', 'left');
  畫字('「' + 台詞 + '」', 530, 245, 21, '#222');
  畫字(底下, 500, 380, 22);
  畫字('點一下畫面 或 按空白鍵 繼續', 500, 430, 18, SETTINGS.色.金);
}
function 畫結束() {
  if (state === 'clear') 畫對話('第 ' + 關卡 + ' 關 過關！', SETTINGS.白泽台詞[關卡 - 1], '準備進入第 ' + (關卡 + 1) + ' 關');
  else if (state === 'win') 畫對話('🎉 契約完成！你贏了！', SETTINGS.白泽台詞[2], '總分 ' + 總分 + ' 分，剩 ' + 命 + ' 條命');
  else 畫對話('小豆累了…', '沒關係，休息一下再來一次！', '這次拿到 ' + 總分 + ' 分');
}

function loop() {
  if (state === 'playing') { 目前關.update(); if (state === 'playing') { 目前關.draw(); 畫HUD(); } }
  if (state === 'start') 畫開始();
  else if (state !== 'playing') { 目前關 && 目前關.draw(); 畫HUD(); 畫結束(); }
  // 常駐操作提示
  if (state === 'playing') {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, H - 28, W, 28);
    畫字(用過鍵盤 ? 目前關.鍵提示 : 目前關.鼠提示, W / 2, H - 14, 15);
  }
  requestAnimationFrame(loop);
}

// ===================== 鍵盤與滑鼠 =====================
function 取得焦點() { try { window.focus(); cv.focus(); } catch (e) {} }
// 用 e.code（實體按鍵位置）判斷，才不會被中文輸入法 / Caps Lock 影響
function 鍵名(e) {
  const c = e.code || '';
  if (c.indexOf('Key') === 0) return c.slice(3).toLowerCase();
  if (c === 'Space') return ' ';
  if (c.indexOf('Arrow') === 0) return c;
  const k = e.key || '';
  return k.length === 1 ? k.toLowerCase() : k;
}
const 遊戲鍵 = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'a', 'd', 'w', 's', ' ', 'Enter'];
window.addEventListener('keydown', e => {
  const k = 鍵名(e); if (遊戲鍵.indexOf(k) < 0) return;
  e.preventDefault(); 用過鍵盤 = true; keys[k] = true;
  if (state !== 'playing') { if (k === ' ' || k === 'Enter') 下一步(); }
});
window.addEventListener('keyup', e => { keys[鍵名(e)] = false; });
function 畫布座標(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener('pointerdown', e => {
  取得焦點(); e.preventDefault();
  const [x, y] = 畫布座標(e); mouse.x = x; mouse.y = y; mouse.down = true;
  if (state !== 'playing') { 下一步(); return; }
  目前關.pointerDown(x, y);
});
cv.addEventListener('pointermove', e => { const [x, y] = 畫布座標(e); mouse.x = x; mouse.y = y; mouse.moved = true; });
window.addEventListener('pointerup', () => { mouse.down = false; mouse.dir = 0; });
window.addEventListener('pointerdown', 取得焦點);
取得焦點();
// 給自動測試用的小窗口
window.G = { get state(){return state}, set state(v){state=v}, get 關卡(){return 關卡}, get 命(){return 命}, set 命(v){命=v},
  get 關分(){return 關分}, get 總分(){return 總分}, get 目前關(){return 目前關}, keys, mouse, 下一步, 重新開始, 開始關卡,
  step(){ if (state==='playing') 目前關.update(); } };
loop();
</script>
