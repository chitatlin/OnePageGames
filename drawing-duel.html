<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>畫畫對決</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131019;
  --ink2:#1E1A28;
  --ink3:#2A2436;
  --line:#3A3348;
  --paper:#FBF7EF;
  --red:#FF3B5C;
  --blue:#2ED9FF;
  --gold:#FFC93C;
  --text:#EFE9F5;
  --muted:#918AA6;
  --display:"Bungee", "Noto Sans TC", system-ui, sans-serif;
  --body:"Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  background-image:
    radial-gradient(1100px 520px at 12% -12%, rgba(255,59,92,.18), transparent 62%),
    radial-gradient(1100px 520px at 88% -8%, rgba(46,217,255,.16), transparent 62%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--body);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  min-height:100vh;
}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 56px}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{font-family:inherit;font-size:1rem}
.hide{display:none !important}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-family:var(--display);font-size:clamp(20px,5.2vw,30px);letter-spacing:.02em;line-height:1}
.brand .a{color:var(--red)}
.brand .b{color:var(--blue)}
.scoreline{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;line-height:1}
.scoreline .r{color:var(--red)}
.scoreline .b{color:var(--blue)}
.scoreline .sep{color:var(--muted);font-size:15px}
.roundtag{font-size:.82rem;color:var(--muted);font-family:var(--body);letter-spacing:.04em}

/* ---------- panels ---------- */
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel + .panel{margin-top:16px}
h2{font-size:1.12rem;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:999px;font-weight:700;
  background:var(--ink3);color:var(--text);border:1px solid var(--line);
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.14)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn-go{background:var(--gold);color:#22190A;border-color:transparent}
.btn-red{background:var(--red);color:#2A000A;border-color:transparent}
.btn-blue{background:var(--blue);color:#00212B;border-color:transparent}
.btn-wide{width:100%}
.btn-sm{padding:8px 14px;font-size:.86rem;font-weight:500}

/* ---------- join ---------- */
.namefield{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.namefield input{
  flex:1 1 200px;min-width:0;padding:13px 16px;border-radius:12px;
  background:var(--ink);border:1px solid var(--line);color:var(--text);
}
.namefield input::placeholder{color:#6A6280}
.seatgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
@media(max-width:560px){.seatgrid{grid-template-columns:1fr;gap:10px}}
.seat{
  border:2px solid var(--line);border-radius:16px;padding:18px 16px;text-align:center;
  background:var(--ink);min-height:132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.seat.A{border-color:rgba(255,59,92,.5)}
.seat.B{border-color:rgba(46,217,255,.5)}
.seat.taken.A{background:linear-gradient(180deg,rgba(255,59,92,.16),transparent)}
.seat.taken.B{background:linear-gradient(180deg,rgba(46,217,255,.16),transparent)}
.seat .who{font-size:1.16rem;font-weight:700;word-break:break-word}
.seat .tag{font-family:var(--display);font-size:.78rem;letter-spacing:.06em}
.seat.A .tag{color:var(--red)}
.seat.B .tag{color:var(--blue)}
.seat .empty{color:var(--muted);font-size:.9rem}
.vsmark{font-family:var(--display);font-size:clamp(26px,7vw,40px);color:var(--muted);text-align:center;line-height:1}
.mine{font-size:.76rem;color:var(--gold);font-weight:700}

/* ---------- prompt + timer ---------- */
.stage{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.ticket{
  flex:1 1 240px;background:var(--paper);color:#191320;border-radius:14px;
  padding:14px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.ticket .lbl{font-size:.74rem;color:#8A8194;letter-spacing:.14em;margin-bottom:2px}
.ticket .word{font-size:clamp(24px,6.4vw,34px);font-weight:900;line-height:1.15;letter-spacing:.01em}
.ticket .hint{font-size:.86rem;color:#6E6578;margin-top:4px}
.clock{
  font-family:var(--display);font-size:clamp(30px,8vw,46px);line-height:1;
  min-width:110px;text-align:center;color:var(--text);
}
.clock.warn{color:var(--red);animation:tick .9s steps(2,end) infinite}
@keyframes tick{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.clock.warn{animation:none}}

/* ---------- canvas ---------- */
.board{
  position:relative;width:100%;aspect-ratio:1/1;max-width:520px;margin:0 auto;
  background:var(--paper);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.42);
}
.board canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.board.locked canvas{cursor:default}
.tools{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  margin:16px auto 0;max-width:520px;
}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.sw[aria-pressed="true"]{border-color:var(--gold);transform:scale(1.12)}
.sizes{display:flex;gap:6px}
.sz{width:30px;height:28px;border-radius:9px;background:var(--ink3);border:1px solid var(--line);display:grid;place-items:center}
.sz[aria-pressed="true"]{border-color:var(--gold);background:var(--ink)}
.sz i{display:block;border-radius:50%;background:var(--text)}
.toolsep{width:1px;height:24px;background:var(--line)}
.submitbar{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.statusline{text-align:center;color:var(--muted);font-size:.88rem;margin-top:12px;min-height:1.4em}

/* ---------- battle ---------- */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
@media(max-width:620px){.arena{grid-template-columns:1fr}.arena .vsbig{padding:2px 0}}
.vsbig{font-family:var(--display);font-size:clamp(24px,6vw,38px);text-align:center;color:var(--muted);padding-top:70px;line-height:1}
.fighter{text-align:center}
.fighter .nm{font-weight:700;font-size:1.02rem;margin-bottom:8px;word-break:break-word}
.fighter.A .nm{color:var(--red)}
.fighter.B .nm{color:var(--blue)}
.art{width:100%;aspect-ratio:1/1;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4);border:3px solid transparent}
.art canvas{display:block;width:100%;height:100%}
.fighter.win .art{border-color:var(--gold);box-shadow:0 0 0 6px rgba(255,201,60,.16),0 12px 30px rgba(0,0,0,.4)}
.crown{font-family:var(--display);color:var(--gold);font-size:.8rem;letter-spacing:.08em;margin-top:8px;min-height:1.2em}
.votes{margin-top:10px;font-size:.88rem;color:var(--muted)}
.votes b{color:var(--text);font-family:var(--display);font-size:1.05rem}

.verdict{margin-top:18px;border-radius:16px;border:1px solid var(--line);background:var(--ink2);padding:18px}
.verdict .head{font-family:var(--display);font-size:.86rem;letter-spacing:.06em;color:var(--gold);margin-bottom:10px}
.verdict p{margin:0 0 12px;white-space:pre-wrap}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
.mini .t{font-weight:700;margin-bottom:6px;font-size:.9rem}
.mini.A .t{color:var(--red)}
.mini.B .t{color:var(--blue)}
.bar{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.bar .track{flex:1;height:6px;border-radius:99px;background:var(--ink3);overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.mini.A .fill{background:var(--red)}
.mini.B .fill{background:var(--blue)}

.note{color:var(--muted);font-size:.86rem}
.err{color:var(--red);font-size:.88rem;min-height:1.2em;margin-top:10px}
.center{text-align:center}
.stack{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--ink3);font-size:.76rem;color:var(--muted)}
.linky{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.84rem;padding:4px}
.linky:hover{color:var(--text)}
.offscreen{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><span class="a">畫畫</span><span class="b">對決</span></div>
    <div class="center">
      <div class="scoreline"><span class="r" id="scoreA">0</span><span class="sep">：</span><span class="b" id="scoreB">0</span></div>
      <div class="roundtag" id="roundTag">還沒開始</div>
    </div>
  </header>

  <!-- 連線中 -->
  <section id="vBoot" class="panel center">
    <h2>連線中</h2>
    <p class="sub" style="margin:0">正在接上對戰房間…</p>
  </section>

  <!-- 無法連線 -->
  <section id="vDead" class="panel hide">
    <h2>這個頁面沒辦法連上房間</h2>
    <p class="sub">對戰需要即時同步才能運作。請從 Claude 裡打開這個作品，或請對方重新分享一次連結。</p>
  </section>

  <!-- 取名 -->
  <section id="vName" class="panel hide">
    <h2>先報上名號</h2>
    <p class="sub">對手會在畫布上方看到這個名字。</p>
    <div class="namefield">
      <input id="nameInput" maxlength="12" placeholder="例如：小明" autocomplete="off">
      <button class="btn btn-go" id="nameGo">進場</button>
    </div>
  </section>

  <!-- 大廳 -->
  <section id="vLobby" class="panel hide">
    <h2 id="lobbyTitle">選一邊坐下</h2>
    <p class="sub" id="lobbySub">兩邊都有人之後就能開打。用右上角的分享把連結傳給對手。</p>
    <div class="seatgrid">
      <div class="seat A" id="seatA">
        <div class="tag">RED</div>
        <div class="who" id="seatAName"></div>
        <button class="btn btn-sm btn-red" id="seatABtn">坐紅方</button>
      </div>
      <div class="vsmark">VS</div>
      <div class="seat B" id="seatB">
        <div class="tag">BLUE</div>
        <div class="who" id="seatBName"></div>
        <button class="btn btn-sm btn-blue" id="seatBBtn">坐藍方</button>
      </div>
    </div>
    <div class="stack">
      <button class="btn btn-go" id="startBtn">出題開打</button>
    </div>
    <div class="err center" id="lobbyErr"></div>
    <p class="note center" style="margin-top:14px">
      一人一台裝置，或同一台電腦開兩個分頁也行。旁邊的人打開連結就能當觀眾投人氣票。
      <br><button class="linky" id="resetScore">比分歸零</button>
    </p>
  </section>

  <!-- 出題中 -->
  <section id="vThink" class="panel center hide">
    <h2 id="thinkTitle">出題中</h2>
    <p class="sub" id="thinkSub" style="margin:0">Claude 正在想這一局要畫什麼…</p>
  </section>

  <!-- 畫圖 -->
  <section id="vDraw" class="hide">
    <div class="stage">
      <div class="ticket">
        <div class="lbl">題目</div>
        <div class="word" id="promptWord">—</div>
        <div class="hint" id="promptHint"></div>
      </div>
      <div class="clock" id="clock">1:00</div>
    </div>

    <div class="board" id="board">
      <canvas id="pad"></canvas>
    </div>

    <div class="tools" id="tools">
      <div class="swatches" id="swatches"></div>
      <div class="toolsep"></div>
      <div class="sizes" id="sizes"></div>
      <div class="toolsep"></div>
      <button class="btn btn-sm" id="undoBtn">復原</button>
      <button class="btn btn-sm" id="clearBtn">清空</button>
    </div>

    <div class="submitbar">
      <button class="btn btn-go" id="submitBtn">畫好了，送出</button>
    </div>
    <div class="statusline" id="drawStatus"></div>
  </section>

  <!-- 比圖 -->
  <section id="vBattle" class="hide">
    <div class="stage">
      <div class="ticket">
        <div class="lbl">題目</div>
        <div class="word" id="bPromptWord">—</div>
      </div>
    </div>

    <div class="arena">
      <div class="fighter A" id="figA">
        <div class="nm" id="bNameA">紅方</div>
        <div class="art"><canvas id="artA"></canvas></div>
        <div class="crown" id="crownA"></div>
        <div class="votes">人氣票 <b id="voteA">0</b></div>
        <button class="btn btn-sm btn-red" id="voteABtn" style="margin-top:8px">投紅方一票</button>
      </div>
      <div class="vsbig">VS</div>
      <div class="fighter B" id="figB">
        <div class="nm" id="bNameB">藍方</div>
        <div class="art"><canvas id="artB"></canvas></div>
        <div class="crown" id="crownB"></div>
        <div class="votes">人氣票 <b id="voteB">0</b></div>
        <button class="btn btn-sm btn-blue" id="voteBBtn" style="margin-top:8px">投藍方一票</button>
      </div>
    </div>

    <div class="verdict hide" id="verdict">
      <div class="head" id="verdictHead">AI 評審</div>
      <p id="verdictText"></p>
      <div class="cards" id="verdictCards"></div>
    </div>

    <div class="stack">
      <button class="btn btn-go" id="judgeBtn">讓 AI 當評審</button>
      <button class="btn" id="nextBtn">下一局</button>
    </div>
    <div class="err center" id="battleErr"></div>
    <p class="note center" id="battleNote"></p>
  </section>

  <p class="note center" id="footer" style="margin-top:28px">
    <button class="linky" id="bailBtn">卡住了？回大廳重來</button>
  </p>
</div>

<canvas id="shot" class="offscreen" width="512" height="512"></canvas>

<script>
(function(){
"use strict";

/* ============ 常數 ============ */
var SPACE = 1000;              // 筆畫座標空間
var DRAW_SECONDS = 60;
var MAX_POINTS = 7000;
var PALETTE = ["#191320","#FF3B5C","#FF9E2C","#FFC93C","#3FCF6B","#2ED9FF","#7C6BFF","#FBF7EF"];
var SIZES = [6, 14, 30];

/* ============ 本機身分 ============ */
var myId = null, myName = "";
try {
  // 身分綁在分頁上：同一台電腦開兩個分頁就是兩個玩家，重新整理不會掉。
  myId = sessionStorage.getItem("dd_id");
  if (!myId) { myId = "u" + Math.random().toString(36).slice(2, 11); sessionStorage.setItem("dd_id", myId); }
} catch (e) {}
if (!myId) myId = "u" + Math.random().toString(36).slice(2, 11);
try { myName = localStorage.getItem("dd_name") || ""; } catch (e) {}

/* ============ DOM ============ */
function $(id){ return document.getElementById(id); }
var views = {
  boot:$("vBoot"), dead:$("vDead"), name:$("vName"), lobby:$("vLobby"),
  think:$("vThink"), draw:$("vDraw"), battle:$("vBattle")
};
function show(which){
  for (var k in views) views[k].classList.toggle("hide", k !== which);
}

/* ============ 狀態 ============ */
var db = null, sample = null, canSendImages = false;
var state = null;                       // game/state 文件
var seats = { A:null, B:null };         // seats/A, seats/B
var art   = { A:null, B:null };         // art/cur_A, art/cur_B
var votes = {};                         // voterId -> {round, seat}
var strokes = [], current = null, drawing = false;
var color = PALETTE[0], size = SIZES[1];
var loadedRound = -1;                   // 本機畫布對應的局數
var submittedLocal = false;
var judging = false, generating = false;
var lastPrompts = [];

function mySeat(){
  if (seats.A && seats.A.id === myId) return "A";
  if (seats.B && seats.B.id === myId) return "B";
  return null;
}
function bothSeated(){ return !!(seats.A && seats.B); }
function nameOf(s){ return (seats[s] && seats[s].name) || (s === "A" ? "紅方" : "藍方"); }
function esc(t){ return String(t == null ? "" : t).replace(/[<>&"]/g, function(c){
  return ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"})[c];
}); }

/* ============ 畫布 ============ */
var pad = $("pad"), padCtx = pad.getContext("2d");

function fitCanvas(cv){
  var r = cv.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(1, Math.round(r.width * dpr));
  if (cv.width !== w || cv.height !== w) { cv.width = w; cv.height = w; }
  return w;
}
function paint(ctx, px, list){
  ctx.save();
  ctx.fillStyle = "#FBF7EF";
  ctx.fillRect(0, 0, px, px);
  var k = px / SPACE;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (var i = 0; i < list.length; i++){
    var s = list[i], p = s.p;
    if (!p || p.length < 2) continue;
    ctx.strokeStyle = s.c; ctx.lineWidth = Math.max(1, s.w * k);
    ctx.beginPath();
    ctx.moveTo(p[0] * k, p[1] * k);
    if (p.length === 2) ctx.lineTo(p[0] * k + 0.01, p[1] * k + 0.01);
    for (var j = 2; j < p.length; j += 2) ctx.lineTo(p[j] * k, p[j+1] * k);
    ctx.stroke();
  }
  ctx.restore();
}
function repaintPad(){ paint(padCtx, fitCanvas(pad), strokes); }

function padPoint(ev){
  var r = pad.getBoundingClientRect();
  var x = ((ev.clientX - r.left) / r.width) * SPACE;
  var y = ((ev.clientY - r.top) / r.height) * SPACE;
  return [Math.round(Math.max(0, Math.min(SPACE, x))), Math.round(Math.max(0, Math.min(SPACE, y)))];
}
function totalPoints(){
  var n = 0;
  for (var i = 0; i < strokes.length; i++) n += strokes[i].p.length / 2;
  return n;
}
function canDraw(){
  return state && state.phase === "drawing" && mySeat() && !submittedLocal;
}

pad.addEventListener("pointerdown", function(ev){
  if (!canDraw()) return;
  if (totalPoints() > MAX_POINTS) { setStatus("畫布滿了，先送出吧"); return; }
  drawing = true;
  try { pad.setPointerCapture(ev.pointerId); } catch(e){}
  var pt = padPoint(ev);
  current = { c: color, w: size, p: [pt[0], pt[1]] };
  strokes.push(current);
  repaintPad();
  ev.preventDefault();
});
pad.addEventListener("pointermove", function(ev){
  if (!drawing || !current) return;
  var pt = padPoint(ev);
  var n = current.p.length;
  var dx = pt[0] - current.p[n-2], dy = pt[1] - current.p[n-1];
  if (dx*dx + dy*dy < 9) return;
  current.p.push(pt[0], pt[1]);
  repaintPad();
  ev.preventDefault();
});
function endStroke(){ drawing = false; current = null; }
pad.addEventListener("pointerup", endStroke);
pad.addEventListener("pointercancel", endStroke);
pad.addEventListener("pointerleave", endStroke);

$("undoBtn").onclick = function(){ if (!canDraw()) return; strokes.pop(); repaintPad(); };
$("clearBtn").onclick = function(){ if (!canDraw()) return; strokes = []; repaintPad(); };

/* 工具列 */
(function buildTools(){
  var sw = $("swatches");
  PALETTE.forEach(function(c, i){
    var b = document.createElement("button");
    b.className = "sw"; b.style.background = c;
    b.setAttribute("aria-label", "顏色 " + (i+1));
    b.setAttribute("aria-pressed", String(c === color));
    b.onclick = function(){
      color = c;
      Array.prototype.forEach.call(sw.children, function(el, j){
        el.setAttribute("aria-pressed", String(PALETTE[j] === color));
      });
    };
    sw.appendChild(b);
  });
  var sz = $("sizes");
  SIZES.forEach(function(s){
    var b = document.createElement("button");
    b.className = "sz";
    b.setAttribute("aria-label", "筆刷粗細 " + s);
    b.setAttribute("aria-pressed", String(s === size));
    var i = document.createElement("i");
    var px = Math.round(s / 2.6) + 3;
    i.style.width = px + "px"; i.style.height = px + "px";
    b.appendChild(i);
    b.onclick = function(){
      size = s;
      Array.prototype.forEach.call(sz.children, function(el, j){
        el.setAttribute("aria-pressed", String(SIZES[j] === size));
      });
    };
    sz.appendChild(b);
  });
})();

window.addEventListener("resize", function(){
  if (!views.draw.classList.contains("hide")) repaintPad();
  if (!views.battle.classList.contains("hide")) renderArt();
});

function setStatus(t){ $("drawStatus").textContent = t || ""; }

/* ============ 上線 ============ */
show("boot");
if (!window.claude || typeof window.claude.use !== "function") { show("dead"); return; }
claude.use("db").then(function(d){
  db = d;
  if (!db) { show("dead"); return; }
  claude.use("sample").then(function(s){
    sample = s;
    if (!sample) return null;
    return sample.limits().then(function(l){ canSendImages = !!(l && l.images); }, function(){});
  }).catch(function(){}).then(subscribe, subscribe);
}, function(){ show("dead"); });

function subscribe(){
  var bad = function(){ show("dead"); };
  db.doc("game/state").onSnapshot(function(snap){
    state = snap.exists ? snap.data : null;
    render();
  }, bad);
  db.doc("seats/A").onSnapshot(function(s){ seats.A = s.exists && s.data && s.data.id ? s.data : null; render(); });
  db.doc("seats/B").onSnapshot(function(s){ seats.B = s.exists && s.data && s.data.id ? s.data : null; render(); });
  db.doc("art/cur_A").onSnapshot(function(s){ art.A = s.exists ? s.data : null; render(); });
  db.doc("art/cur_B").onSnapshot(function(s){ art.B = s.exists ? s.data : null; render(); });
  db.collection("votes").onSnapshot(function(q){
    votes = {};
    q.docs.forEach(function(d){ votes[d.id] = d.data; });
    render();
  });
  if (!myName) show("name"); else show("lobby");
}

/* ============ 取名 ============ */
$("nameInput").value = myName;
$("nameGo").onclick = saveName;
$("nameInput").addEventListener("keydown", function(e){ if (e.key === "Enter") saveName(); });
function saveName(){
  var v = $("nameInput").value.trim().slice(0, 12);
  if (!v) { $("nameInput").focus(); return; }
  myName = v;
  try { localStorage.setItem("dd_name", v); } catch(e){}
  render();
}

/* ============ 座位 ============ */
function claimSeat(letter){
  $("lobbyErr").textContent = "";
  var other = letter === "A" ? "B" : "A";
  if (seats[other] && seats[other].id === myId) { $("lobbyErr").textContent = "你已經坐在另一邊了。"; return; }
  var ref = db.doc("seats/" + letter);
  ref.acquire({ holder: myId, ttlMs: 6000 }).then(function(res){
    if (!res || !res.acquired) { $("lobbyErr").textContent = "有人正在搶這個位子，稍等一下再試。"; return; }
    return ref.get().then(function(snap){
      if (snap.exists && snap.data && snap.data.id && snap.data.id !== myId) {
        $("lobbyErr").textContent = "這個位子已經有人了。";
        return;
      }
      return ref.set({ id: myId, name: myName, at: Date.now() });
    });
  }).catch(function(){ $("lobbyErr").textContent = "坐下失敗，再按一次。"; });
}
function leaveSeat(letter){
  db.doc("seats/" + letter).set({ id: "", name: "", at: Date.now() }).catch(function(){});
}
$("seatABtn").onclick = function(){ seatBtnAction("A"); };
$("seatBBtn").onclick = function(){ seatBtnAction("B"); };
function seatBtnAction(letter){
  var s = seats[letter];
  if (!s) return claimSeat(letter);
  if (s.id === myId) return leaveSeat(letter);
  leaveSeat(letter);   // 幫忙清掉離線的人
}

/* ============ 重設 ============ */
$("resetScore").onclick = function(){
  db.doc("game/state").set({
    round: 0, phase: "lobby", prompt: "", hint: "",
    deadlines: {}, scores: { A:0, B:0 }, judge: null, settled: false, startedAt: Date.now()
  }).catch(function(){});
};
$("bailBtn").onclick = function(){
  if (!db) return;
  var sc = (state && state.scores) || { A:0, B:0 };
  generating = false; judging = false; loadedRound = -1; submittedLocal = false;
  db.doc("game/state").set({
    round: (state && state.round) || 0, phase: "lobby", prompt: "", hint: "",
    deadlines: {}, scores: sc, judge: null, settled: true, startedAt: Date.now()
  }).catch(function(){});
};

/* ============ 出題 ============ */
$("startBtn").onclick = function(){ startRound(((state && state.round) || 0) + 1); };
$("nextBtn").onclick = function(){
  settleIfNeeded().then(function(){ startRound((state && state.round ? state.round : 0) + 1); });
};

function startRound(round){
  if (generating) return;
  $("lobbyErr").textContent = "";
  $("battleErr").textContent = "";
  if (!bothSeated()) { $("lobbyErr").textContent = "兩個位子都要有人才能開打。"; return; }
  generating = true;
  var scores = (state && state.scores) || { A:0, B:0 };
  db.doc("game/state").set({
    round: round, phase: "thinking", prompt: "", hint: "",
    deadlines: {}, scores: scores, judge: null, settled: false, startedAt: Date.now()
  }).catch(function(){});

  makePrompt(round).then(function(p){
    var local = seats.A.id === seats.B.id;
    var now = Date.now(), dl = now + DRAW_SECONDS * 1000;
    return Promise.all([
      db.doc("art/cur_A").set({ round: round, seat: "A", done: false, strokes: [] }),
      db.doc("art/cur_B").set({ round: round, seat: "B", done: false, strokes: [] })
    ]).then(function(){
      return db.doc("game/state").set({
        round: round, phase: "drawing", prompt: p.prompt, hint: p.hint || "",
        deadlines: { A: dl, B: local ? 0 : dl },
        scores: scores, judge: null, settled: false, startedAt: now
      });
    });
  }).catch(function(){
    $("lobbyErr").textContent = "出題失敗了，再按一次「出題開打」。";
    db.doc("game/state").set({
      round: round, phase: "lobby", prompt: "", hint: "",
      deadlines: {}, scores: scores, judge: null, settled: false, startedAt: Date.now()
    }).catch(function(){});
  }).then(function(){ generating = false; }, function(){ generating = false; });
}

var FALLBACK = [
  { prompt:"戴墨鏡的柴犬", hint:"墨鏡越大越好認" },
  { prompt:"在跑步的鬧鐘", hint:"腳跟指針一起動" },
  { prompt:"吃拉麵的太空人", hint:"頭盔怎麼辦？" },
  { prompt:"會噴火的鳳梨", hint:"葉子是頭髮" },
  { prompt:"彈吉他的章魚", hint:"手很多隻" },
  { prompt:"下雨天的便利商店", hint:"招牌和傘" },
  { prompt:"睡著的火山", hint:"煙圈當呼嚕" },
  { prompt:"騎腳踏車的企鵝", hint:"重心在肚子" }
];

function makePrompt(round){
  if (!sample) return Promise.resolve(FALLBACK[Math.floor(Math.random() * FALLBACK.length)]);
  var avoid = lastPrompts.slice(-6).join("、");
  var ask =
    "你是一個畫畫對決小遊戲的出題官。請出一個題目，讓兩個玩家在 60 秒內用滑鼠或手指塗鴉畫出來。\n" +
    "要求：具體、看得見、好玩、帶一點反差或組合感；不要抽象概念，不要真實人名或品牌，不要文字遊戲。\n" +
    "題目用繁體中文，4 到 10 個字。提示是一句給畫的人的小訣竅，15 字以內。\n" +
    (avoid ? "不要出這些用過的題目：" + avoid + "。\n" : "") +
    "這是第 " + round + " 局，種子 " + Math.random().toString(36).slice(2, 8) + "。\n" +
    '只回覆 JSON，格式：{"prompt":"戴墨鏡的柴犬","hint":"墨鏡越大越好認"}';
  return sample.json(ask, { modelTier: "quick", cache: false }).then(function(v){
    if (!v || typeof v.prompt !== "string" || !v.prompt.trim()) throw new Error("bad");
    var p = { prompt: v.prompt.trim().slice(0, 20), hint: typeof v.hint === "string" ? v.hint.trim().slice(0, 30) : "" };
    lastPrompts.push(p.prompt);
    return p;
  });
}

/* ============ 送出 ============ */
$("submitBtn").onclick = function(){ submitArt(false); };

function submitArt(auto){
  var seat = mySeat();
  if (!seat || submittedLocal || !state || state.phase !== "drawing") return;
  submittedLocal = true;
  $("submitBtn").disabled = true;
  setStatus(auto ? "時間到，自動送出了" : "送出中…");
  db.doc("art/cur_" + seat).set({
    round: state.round, seat: seat, done: true, strokes: trimStrokes(strokes)
  }).then(function(){
    setStatus("送出完成，等對手");
    // 同機雙人：換下一位開始計時
    if (seats.A && seats.B && seats.A.id === seats.B.id) {
      var other = seat === "A" ? "B" : "A";
      var d = state.deadlines || {};
      if (!d[other]) {
        var nd = { A: d.A || 0, B: d.B || 0 };
        nd[other] = Date.now() + DRAW_SECONDS * 1000;
        db.doc("game/state").update({ deadlines: nd }).catch(function(){});
      }
    }
  }).catch(function(){
    submittedLocal = false;
    $("submitBtn").disabled = false;
    setStatus("送出失敗，再按一次");
  });
}
function trimStrokes(list){
  var out = [], pts = 0;
  for (var i = 0; i < list.length; i++){
    var s = list[i];
    if (!s.p || s.p.length < 2) continue;
    if (pts + s.p.length / 2 > MAX_POINTS) break;
    pts += s.p.length / 2;
    out.push({ c: s.c, w: s.w, p: s.p });
  }
  return out;
}

/* ============ 投票 ============ */
$("voteABtn").onclick = function(){ castVote("A"); };
$("voteBBtn").onclick = function(){ castVote("B"); };
function castVote(seat){
  if (!state || state.phase !== "battle") return;
  if (mySeat() === seat) return;
  db.collection("votes").doc(myId).set({ round: state.round, seat: seat, name: myName || "觀眾" }).catch(function(){});
}
function tally(){
  var t = { A:0, B:0 };
  for (var k in votes){
    var v = votes[k];
    if (v && state && v.round === state.round && (v.seat === "A" || v.seat === "B")) t[v.seat]++;
  }
  return t;
}

/* ============ AI 評審 ============ */
$("judgeBtn").onclick = runJudge;

function toBlob(list){
  var shot = $("shot"), ctx = shot.getContext("2d");
  paint(ctx, 512, list || []);
  return new Promise(function(res, rej){
    shot.toBlob(function(b){ b ? res(b) : rej(new Error("blob")); }, "image/png");
  });
}
function runJudge(){
  if (judging || !state || state.phase !== "battle") return;
  if (!sample || !canSendImages) { $("battleErr").textContent = "這個帳號沒辦法讓 AI 看圖，先用人氣票決勝負吧。"; return; }
  if (!art.A || !art.B) return;
  judging = true;
  $("judgeBtn").disabled = true;
  $("verdict").classList.remove("hide");
  $("verdictHead").textContent = "AI 評審";
  $("verdictText").textContent = "評審正在看圖…";
  $("verdictCards").innerHTML = "";
  $("battleErr").textContent = "";

  var blobs = [];
  toBlob(art.A.strokes).then(function(b){ blobs.push(b); return toBlob(art.B.strokes); }).then(function(b2){
    blobs.push(b2);
    var ask =
      "這是一場塗鴉對決，題目是「" + state.prompt + "」。兩位玩家各有 60 秒，用滑鼠或手指畫。\n" +
      "第一張圖是紅方「" + nameOf("A") + "」畫的，第二張圖是藍方「" + nameOf("B") + "」畫的。\n" +
      "請當一個看得懂塗鴉、講話幽默但公正的評審。就三個面向各給 0 到 10 分：切題（像不像題目）、創意、筆下功夫。\n" +
      "評語用繁體中文兩到三句，具體講出你在圖上看到什麼，可以吐槽但不要刻薄，最後說明誰贏。\n" +
      '只回覆 JSON：{"winner":"A","red":{"fit":8,"idea":7,"skill":6},"blue":{"fit":5,"idea":9,"skill":7},"comment":"評語"}';
    return sample.json(ask, { images: blobs, modelTier: "default", cache: false });
  }).then(function(v){
    if (!v || (v.winner !== "A" && v.winner !== "B")) throw new Error("bad");
    var sc = (state.scores) || { A:0, B:0 };
    var ns = { A: sc.A || 0, B: sc.B || 0 };
    ns[v.winner] = (ns[v.winner] || 0) + 1;
    return db.doc("game/state").update({
      judge: {
        winner: v.winner,
        red: safeScore(v.red), blue: safeScore(v.blue),
        comment: typeof v.comment === "string" ? v.comment.slice(0, 400) : ""
      },
      scores: ns, settled: true
    });
  }).catch(function(e){
    $("verdict").classList.add("hide");
    $("battleErr").textContent = (e && e.code === "not_granted")
      ? "你沒有允許使用 Claude，這局就用人氣票決定吧。"
      : "評審看不下去（大概是網路）。再試一次，或直接用人氣票。";
  }).then(function(){ judging = false; $("judgeBtn").disabled = false; });
}
function safeScore(o){
  function n(x){ x = Number(x); return isFinite(x) ? Math.max(0, Math.min(10, Math.round(x))) : 5; }
  o = o || {};
  return { fit: n(o.fit), idea: n(o.idea), skill: n(o.skill) };
}
function settleIfNeeded(){
  if (!state || state.settled) return Promise.resolve();
  var t = tally();
  if (t.A === t.B) return Promise.resolve();
  var w = t.A > t.B ? "A" : "B";
  var sc = state.scores || { A:0, B:0 };
  var ns = { A: sc.A || 0, B: sc.B || 0 };
  ns[w] = (ns[w] || 0) + 1;
  return db.doc("game/state").update({ scores: ns, settled: true }).catch(function(){});
}

/* ============ 渲染 ============ */
var clockTimer = setInterval(tickClock, 250);

function render(){
  if (!db) return;
  if (!myName) { show("name"); return; }

  var sc = (state && state.scores) || { A:0, B:0 };
  $("scoreA").textContent = sc.A || 0;
  $("scoreB").textContent = sc.B || 0;
  $("roundTag").textContent = state && state.round ? "第 " + state.round + " 局" : "還沒開始";

  var phase = state ? state.phase : "lobby";

  if (phase === "drawing" && art[mySeat()] && art[mySeat()].round === state.round && art[mySeat()].done) {
    submittedLocal = true;
  }

  if (phase === "drawing" && mySeat()) { show("draw"); renderDraw(); }
  else if (phase === "drawing") { show("think"); $("thinkTitle").textContent = "對決進行中"; $("thinkSub").textContent = "兩位選手正在畫「" + (state.prompt || "") + "」，畫完就會出現。"; }
  else if (phase === "thinking") { show("think"); $("thinkTitle").textContent = "出題中"; $("thinkSub").textContent = "Claude 正在想這一局要畫什麼…"; }
  else if (phase === "battle") { show("battle"); renderBattle(); }
  else { show("lobby"); renderLobby(); }

  maybeAdvance();
}

function renderLobby(){
  ["A","B"].forEach(function(L){
    var s = seats[L], box = $("seat" + L), nameEl = $("seat" + L + "Name"), btn = $("seat" + L + "Btn");
    box.classList.toggle("taken", !!s);
    if (s){
      nameEl.innerHTML = esc(s.name || "玩家") + (s.id === myId ? ' <span class="mine">（你）</span>' : "");
      btn.textContent = s.id === myId ? "離開座位" : "把他請下來";
      btn.className = "btn btn-sm" + (s.id === myId ? "" : "");
    } else {
      nameEl.innerHTML = '<span class="empty">空位</span>';
      btn.textContent = L === "A" ? "坐紅方" : "坐藍方";
      btn.className = "btn btn-sm " + (L === "A" ? "btn-red" : "btn-blue");
    }
  });
  var ready = bothSeated();
  $("startBtn").disabled = !ready;
  $("startBtn").textContent = state && state.round ? "下一局，重新出題" : "出題開打";
  $("lobbySub").textContent = ready
    ? "兩邊都到齊了。按下出題，Claude 會現想一個題目，60 秒開畫。"
    : "兩邊都有人之後就能開打。用右上角的分享把連結傳給對手。";
}

function renderDraw(){
  var seat = mySeat();
  $("promptWord").textContent = state.prompt || "—";
  $("promptHint").textContent = state.hint || "";

  if (loadedRound !== state.round){
    loadedRound = state.round;
    strokes = [];
    submittedLocal = !!(art[seat] && art[seat].round === state.round && art[seat].done);
    repaintPad();
  }
  var d = (state.deadlines || {})[seat] || 0;
  var waiting = !d;
  $("board").classList.toggle("locked", submittedLocal || waiting);
  $("submitBtn").disabled = submittedLocal || waiting;
  $("tools").style.opacity = (submittedLocal || waiting) ? ".4" : "1";
  $("tools").style.pointerEvents = (submittedLocal || waiting) ? "none" : "auto";

  var other = seat === "A" ? "B" : "A";
  var otherDone = !!(art[other] && art[other].round === state.round && art[other].done);
  if (waiting) setStatus("換人了，等 " + nameOf(other) + " 畫完再輪到你");
  else if (submittedLocal) setStatus(otherDone ? "兩邊都好了，準備比圖…" : "已送出，等 " + nameOf(other) + "…");
  else setStatus(otherDone ? nameOf(other) + " 已經畫完了" : "");
  tickClock();
}

function tickClock(){
  if (!state || state.phase !== "drawing") return;
  var seat = mySeat();
  var d = seat ? (state.deadlines || {})[seat] : Math.max(state.deadlines && state.deadlines.A || 0, state.deadlines && state.deadlines.B || 0);
  var el = $("clock");
  if (!d) { el.textContent = "--"; el.classList.remove("warn"); return; }
  var left = Math.max(0, Math.ceil((d - Date.now()) / 1000));
  el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  el.classList.toggle("warn", left <= 10 && left > 0 && !submittedLocal);
  if (left === 0 && seat && !submittedLocal) submitArt(true);
  if (left === 0) maybeAdvance();
}

function maybeAdvance(){
  if (!state || state.phase !== "drawing") return;
  var r = state.round;
  var aDone = !!(art.A && art.A.round === r && art.A.done);
  var bDone = !!(art.B && art.B.round === r && art.B.done);
  var d = state.deadlines || {};
  var expired = d.A && d.B && Date.now() > Math.max(d.A, d.B) + 2000;
  if ((aDone && bDone) || expired){
    if (!mySeat()) return;                  // 交給選手推進，避免觀眾亂寫
    db.doc("game/state").update({ phase: "battle" }).catch(function(){});
  }
}

function renderArt(){
  ["A","B"].forEach(function(L){
    var cv = $("art" + L);
    var px = fitCanvas(cv);
    var a = art[L];
    var list = (a && a.round === state.round && a.strokes) ? a.strokes : [];
    paint(cv.getContext("2d"), px, list);
  });
}

function renderBattle(){
  $("bPromptWord").textContent = state.prompt || "—";
  $("bNameA").textContent = nameOf("A");
  $("bNameB").textContent = nameOf("B");
  renderArt();

  var t = tally();
  $("voteA").textContent = t.A;
  $("voteB").textContent = t.B;
  var mine = votes[myId];
  var voted = mine && mine.round === state.round ? mine.seat : null;
  ["A","B"].forEach(function(L){
    var b = $("vote" + L + "Btn");
    var isSelf = mySeat() === L;
    b.disabled = isSelf;
    b.textContent = isSelf ? "不能投給自己"
      : voted === L ? "✓ 你投了" + (L === "A" ? "紅方" : "藍方")
      : "投" + (L === "A" ? "紅方" : "藍方") + "一票";
  });

  var j = state.judge;
  $("figA").classList.toggle("win", !!j && j.winner === "A");
  $("figB").classList.toggle("win", !!j && j.winner === "B");
  $("crownA").textContent = j && j.winner === "A" ? "WINNER" : "";
  $("crownB").textContent = j && j.winner === "B" ? "WINNER" : "";

  var judgeReady = !!(sample && canSendImages);
  $("judgeBtn").classList.toggle("hide", !!j || !judgeReady);
  $("judgeBtn").disabled = judging;
  $("battleNote").textContent = j ? "AI 評審那一票已經算進比分了。"
    : judgeReady ? "AI 評審會看圖評分，勝的那邊拿一分。人氣票是額外的。"
    : "這個帳號沒辦法讓 AI 看圖，這局就用人氣票多的那邊得分。";

  if (j){
    $("verdict").classList.remove("hide");
    $("verdictHead").textContent = "AI 評審：" + nameOf(j.winner) + " 勝";
    $("verdictText").textContent = j.comment || "";
    $("verdictCards").innerHTML =
      scoreCard("A", nameOf("A"), j.red) + scoreCard("B", nameOf("B"), j.blue);
  } else if (!judging) {
    $("verdict").classList.add("hide");
  }
  $("nextBtn").textContent = j ? "下一局" : "跳過評審，下一局";
}

function scoreCard(L, name, s){
  s = s || { fit:0, idea:0, skill:0 };
  var rows = [["切題", s.fit], ["創意", s.idea], ["功夫", s.skill]].map(function(r){
    return '<div class="bar"><span style="width:2.6em">' + r[0] + '</span>' +
           '<span class="track"><span class="fill" style="width:' + (r[1] * 10) + '%"></span></span>' +
           '<span>' + r[1] + '</span></div>';
  }).join("");
  return '<div class="mini ' + L + '"><div class="t">' + esc(name) + '</div>' + rows + '</div>';
}

})();
</script>
