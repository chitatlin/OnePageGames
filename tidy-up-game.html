<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整理一下 · 二十一道小整理</title>
<style>
:root{
  color-scheme: light;
  --paper:#E7E9DF; --board:#F4F2E7; --ink:#2C3733; --soft:#6E7A73;
  --line:#B6BAAB; --gold:#D8A22A; --pine:#2F6E62; --edge:#D6D3C2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Hiragino Sans TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  padding:10px 12px 24px;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:600px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-size:26px;margin:0;letter-spacing:.22em;font-weight:600}
.sub{font-size:11px;color:var(--soft);letter-spacing:.16em;margin-top:4px}
.sound{border:1px solid var(--edge);background:transparent;color:var(--soft);
  border-radius:999px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
.dots{display:flex;gap:5px;margin:0 0 8px;flex-wrap:wrap}
.dot{width:29px;height:26px;border-radius:7px;border:1px solid var(--edge);
  background:transparent;color:var(--soft);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:.18s}
.dot.now{border-color:var(--ink);color:var(--ink);font-weight:600}
.dot.ok{background:var(--pine);border-color:var(--pine);color:#F4F2E7}
.dot.hard{border-color:#C9A45A}
.dot.hard.ok{border-color:var(--pine)}
.namebar{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.namebar b{font-size:16px;font-weight:600;letter-spacing:.06em}
.namebar span{font-size:12px;color:var(--soft)}
.namebar .lvl{color:var(--gold);letter-spacing:.1em;font-size:12px}
.stage{position:relative;width:100%;overflow:hidden}
.board{position:absolute;top:0;left:0;width:560px;height:440px;transform-origin:top left;
  background:var(--board);border:1px solid var(--edge);border-radius:16px;
  box-shadow:inset 0 1px 0 #fff, 0 2px 0 rgba(0,0,0,.05);
  background-image:linear-gradient(rgba(120,130,120,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,130,120,.055) 1px,transparent 1px);
  background-size:28px 28px;overflow:hidden;touch-action:none}
.decor{position:absolute;inset:0;pointer-events:none}
.slot{position:absolute;border:2px dashed var(--line);border-radius:9px;opacity:.8;
  transition:border-color .15s,background .15s}
.slot.hidden{border-color:transparent}
.slot.hot{border-color:var(--gold);background:rgba(216,162,42,.14)}
.item{position:absolute;top:0;left:0;cursor:grab;touch-action:none;
  filter:drop-shadow(0 2px 2px rgba(60,60,40,.18))}
.item.snap{transition:transform .2s cubic-bezier(.2,.9,.25,1)}
.item.drag{cursor:grabbing;filter:drop-shadow(0 9px 9px rgba(60,60,40,.25))}
.item.aligned{filter:drop-shadow(0 0 7px rgba(216,162,42,.95))}
.item.turn{cursor:ew-resize}
.item.hand{pointer-events:none}      /* 只有指針本體吃得到觸控,兩根針才不會互搶 */
.item.wrong{animation:shake .4s}
@keyframes shake{0%,100%{margin-left:0}20%{margin-left:-5px}60%{margin-left:5px}}
svg{display:block}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:13px;letter-spacing:.06em;border:1px solid var(--edge);
  background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;transition:.18s}
.btn:hover{border-color:var(--ink)}
.btn.key{background:var(--ink);border-color:var(--ink);color:#F4F2E7}
.btn:disabled{opacity:.35;cursor:default}
.tip{font-size:12px;color:var(--soft);margin-top:12px;line-height:1.75}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--ink);color:#F4F2E7;padding:10px 18px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;z-index:60;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.stamp{position:absolute;left:50%;top:50%;z-index:40;
  transform:translate(-50%,-50%) rotate(-13deg) scale(.4);opacity:0;
  border:3px solid var(--pine);color:var(--pine);border-radius:12px;padding:12px 26px;
  font-size:30px;font-weight:700;letter-spacing:.3em;background:rgba(244,242,231,.86);pointer-events:none}
.stamp.on{animation:stampIn .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stampIn{to{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}}
.conf{position:absolute;width:9px;height:13px;border-radius:2px;z-index:39;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .stamp.on{animation:none;opacity:1;transform:translate(-50%,-50%) rotate(-6deg)}
  .conf{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>整理一下</h1>
      <div class="sub">二十一道小整理 · 打開就玩，不用登入</div>
    </div>
    <button class="sound btn" id="sndBtn" title="音效開關">🔊</button>
  </header>
  <div class="dots" id="dots"></div>
  <div class="namebar"><b id="lvName"></b><span class="lvl" id="lvDiff"></span><span id="lvHint"></span></div>
  <div class="stage" id="stage"><div class="board" id="board"></div></div>
  <div class="controls">
    <button class="btn" id="hintBtn">提示</button>
    <button class="btn" id="resetBtn">重來</button>
    <button class="btn" id="prevBtn">← 上一關</button>
    <button class="btn key" id="nextBtn">下一關 →</button>
  </div>
  <p class="tip">三種操作：<b>拖曳＝搬動</b>、<b>左右拖曳＝轉動</b>（轉正類）、<b>輕點一下＝轉 90°</b>（拼合類）。放對時音階會往上爬，放錯的那幾個會抖一下。★★★★ 的四關是給想被折磨的人準備的。</p>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 基本設定 ================= */
const BW=560, BH=440;
const C={ rose:'#C4756B', mustard:'#D8A22A', sage:'#7E9B6E', sky:'#6E93B8',
          plum:'#8A6E9B', clay:'#B5714C', pine:'#2F6E62', slate:'#5C6B72' };
const RAINBOW=['#C4453C','#DC8534','#E0BE3E','#5F9155','#3E8C86','#4A6FA5','#85559B'];
const WARM=['#F0C86A','#E39A3C','#D4692F','#A93B2A'];
const COOL=['#9FCBD6','#5FA2C0','#3D6FA8','#2C3F80'];
const GRAD=[84,76,68,60,52,44,36,28].map(l=>'hsl(198,38%,'+l+'%)');
const BLU=[80,68,56,44,32].map(l=>'hsl(205,45%,'+l+'%)');
const GRN=[78,66,54,42,30].map(l=>'hsl(122,28%,'+l+'%)');
const SUD=[C.rose,C.sky,C.mustard,C.sage];

/* ================= 音效引擎(Web Audio 現場合成,不用音檔) ================= */
let soundOn=true, ac=null, master=null, noiseBuf=null;
function audio(){
  if(ac) return ac;
  try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  master=ac.createGain(); master.gain.value=0.9; master.connect(ac.destination);
  const n=Math.floor(ac.sampleRate*0.35);
  noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  return ac;
}
function unlock(){ const a=audio(); if(a&&a.state==='suspended') a.resume(); }
function tone(f,dur,vol,type,when,slideTo){
  if(!soundOn) return; const a=audio(); if(!a) return;
  const t=a.currentTime+(when||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.014);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function click(vol,freq,dur){
  if(!soundOn) return; const a=audio(); if(!a) return;
  const t=a.currentTime;
  const s=a.createBufferSource(); s.buffer=noiseBuf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1800; f.Q.value=1.1;
  const g=a.createGain();
  g.gain.setValueAtTime(vol||0.05,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.07));
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+0.35);
}
const PENT=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760,2093,2349.3,
            2637,2793,3136,3520,3951,4186,4699,5274,5920,6645,7040,7458,7902];
const sfxPick =()=>{ click(0.05,2600,0.05); tone(300,0.05,0.02,'sine'); };
function sfxSnap(k){
  const f=PENT[Math.min(Math.max(k,0),PENT.length-1)];
  click(0.03,3200,0.04); tone(f,0.24,0.055,'sine'); tone(f*2,0.11,0.014,'triangle',0.01);
}
const sfxOut  =()=>{ click(0.035,1200,0.06); tone(240,0.09,0.025,'sine',0,180); };
const sfxTick =()=> tone(1500,0.03,0.013,'sine');
const sfxSpin =()=>{ click(0.045,900,0.06); tone(420,0.07,0.025,'triangle',0,620); };
const sfxNope =()=>{ tone(190,0.28,0.05,'sine',0,120); click(0.03,520,0.14); };
function sfxWin(){
  [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,0.5,0.05,'sine',i*0.085));
  tone(261.63,1.1,0.028,'triangle',0.02); tone(392,1.1,0.022,'triangle',0.04);
}
function sfxAll(){
  [523.25,659.25,783.99,1046.5,1318.5,1567.98,2093].forEach((f,i)=>tone(f,0.65,0.05,'sine',i*0.1));
  tone(261.63,1.8,0.03,'triangle',0.05); tone(392,1.8,0.025,'triangle',0.05);
}
const sfxUi=()=>click(0.03,1400,0.04);

/* ================= 畫東西(全部 SVG 現畫) ================= */
let uid=0;
function wrapSvg(w,h,inner){
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">'+inner+'</svg>';
}
function drawPencil(w,h,color){
  const be=w-34;
  return wrapSvg(w,h,
    '<rect x="0" y="4" width="18" height="'+(h-8)+'" rx="6" fill="#E6B0A6"/>'+
    '<rect x="13" y="4" width="10" height="'+(h-8)+'" fill="#C7C9BB"/>'+
    '<rect x="21" y="3" width="'+(be-21)+'" height="'+(h-6)+'" rx="3" fill="'+color+'"/>'+
    '<rect x="21" y="5" width="'+(be-21)+'" height="5" rx="2" fill="rgba(255,255,255,.28)"/>'+
    '<polygon points="'+be+',3 '+be+','+(h-3)+' '+(w-9)+','+(h/2)+'" fill="#E4D2A6"/>'+
    '<polygon points="'+(w-17)+','+(h/2-4.6)+' '+(w-17)+','+(h/2+4.6)+' '+(w-2)+','+(h/2)+'" fill="#3B403C"/>');
}
function drawBook(w,h,color){
  return wrapSvg(w,h,
    '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="4" fill="'+color+'"/>'+
    '<rect x="0" y="0" width="7" height="'+h+'" fill="rgba(0,0,0,.15)"/>'+
    '<rect x="14" y="'+(h*0.22)+'" width="'+Math.max(8,w-26)+'" height="4" rx="2" fill="rgba(255,255,255,.55)"/>'+
    '<rect x="14" y="'+(h*0.22+11)+'" width="'+Math.max(6,w-38)+'" height="4" rx="2" fill="rgba(255,255,255,.35)"/>'+
    '<rect x="0" y="'+(h-9)+'" width="'+w+'" height="4" fill="rgba(0,0,0,.10)"/>');
}
function drawCrayon(w,h,color){
  return wrapSvg(w,h,
    '<polygon points="'+(w/2)+',0 '+(w-3)+',24 3,24" fill="'+color+'"/>'+
    '<rect x="2" y="20" width="'+(w-4)+'" height="'+(h-20)+'" rx="4" fill="'+color+'"/>'+
    '<rect x="2" y="'+(h*0.36)+'" width="'+(w-4)+'" height="'+(h*0.32)+'" fill="rgba(255,255,255,.82)"/>'+
    '<rect x="2" y="'+(h*0.36)+'" width="'+(w-4)+'" height="3" fill="rgba(0,0,0,.10)"/>'+
    '<rect x="2" y="'+(h*0.68-3)+'" width="'+(w-4)+'" height="3" fill="rgba(0,0,0,.10)"/>'+
    '<rect x="'+(w/2-6)+'" y="'+(h*0.45)+'" width="12" height="10" rx="2" fill="'+color+'" opacity=".5"/>');
}
const SOCK_D="M6 10 a6 6 0 0 1 6-6 h20 a6 6 0 0 1 6 6 v30 h6 a13 13 0 0 1 0 26 h-32 a6 6 0 0 1 -6-6 z";
function drawSock(w,h,color,pat){
  const id='sk'+(++uid);
  let deco='';
  if(pat==='stripe') deco=[0,1,2,3].map(i=>'<rect x="0" y="'+(16+i*14)+'" width="60" height="7" fill="rgba(255,255,255,.62)"/>').join('');
  if(pat==='dot') deco=[[14,18],[30,18],[14,34],[30,34],[16,50],[34,52],[46,58]]
    .map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.2" fill="rgba(255,255,255,.72)"/>').join('');
  return wrapSvg(w,h,
    '<defs><clipPath id="'+id+'"><path d="'+SOCK_D+'"/></clipPath></defs>'+
    '<path d="'+SOCK_D+'" fill="'+color+'"/>'+
    '<g clip-path="url(#'+id+')">'+deco+'</g>'+
    '<path d="M6 10 a6 6 0 0 1 6-6 h20 a6 6 0 0 1 6 6 v7 h-32 z" fill="rgba(255,255,255,.45)"/>');
}
function starPoints(s){
  const p=[];
  for(let i=0;i<10;i++){
    const R=(i%2===0)?s/2-2:(s/2-2)*0.44, a=-Math.PI/2+i*Math.PI/5;
    p.push((s/2+Math.cos(a)*R).toFixed(1)+','+(s/2+Math.sin(a)*R).toFixed(1));
  }
  return p.join(' ');
}
function drawStar(s,color){
  return wrapSvg(s,s,'<polygon points="'+starPoints(s)+'" fill="'+color+'"/>'+
    '<circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+(s*0.1)+'" fill="rgba(255,255,255,.5)"/>');
}
function shapeSvgBody(kind,s,color){
  if(kind==='circle') return '<circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+(s/2-2)+'" fill="'+color+'"/>';
  if(kind==='square') return '<rect x="3" y="3" width="'+(s-6)+'" height="'+(s-6)+'" rx="6" fill="'+color+'"/>';
  return '<polygon points="'+(s/2)+',3 '+(s-3)+','+(s-5)+' 3,'+(s-5)+'" fill="'+color+'"/>';
}
function drawShape(kind,s,color){ return wrapSvg(s,s,shapeSvgBody(kind,s,color)); }
function drawChip(w,h,color){
  return wrapSvg(w,h,
    '<rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" rx="9" fill="'+color+'"/>'+
    '<rect x="1" y="1" width="'+(w-2)+'" height="'+((h-2)/2)+'" rx="9" fill="rgba(255,255,255,.14)"/>');
}
function drawBlock(w,h,color){
  return wrapSvg(w,h,
    '<rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" rx="7" fill="'+color+'"/>'+
    '<rect x="1" y="1" width="'+(w-2)+'" height="'+((h-2)*0.42)+'" rx="7" fill="rgba(255,255,255,.15)"/>'+
    '<rect x="'+(w*0.5-9)+'" y="'+(h*0.5-2.5)+'" width="18" height="5" rx="2.5" fill="rgba(0,0,0,.13)"/>');
}
function drawFrame(w,h,color){
  const iw=w-14, ih=h-14;
  return wrapSvg(w,h,
    '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="4" fill="'+color+'"/>'+
    '<rect x="7" y="7" width="'+iw+'" height="'+ih+'" fill="#FBF9F0"/>'+
    '<circle cx="'+(7+iw*0.68)+'" cy="'+(7+ih*0.3)+'" r="'+(Math.min(iw,ih)*0.13)+'" fill="#E0BE3E"/>'+
    '<path d="M7 '+(7+ih)+' L'+(7+iw*0.42)+' '+(7+ih*0.42)+' L'+(7+iw*0.72)+' '+(7+ih)+' Z" fill="#9CB38C"/>'+
    '<path d="M'+(7+iw*0.5)+' '+(7+ih)+' L'+(7+iw*0.78)+' '+(7+ih*0.6)+' L'+(7+iw)+' '+(7+ih)+' Z" fill="#7E9B6E"/>');
}
function drawArrow(w,h,color){
  return wrapSvg(w,h,
    '<rect x="4" y="'+(h/2-4)+'" width="'+(w-26)+'" height="8" rx="4" fill="'+color+'"/>'+
    '<polygon points="'+(w-26)+',1 '+(w-1)+','+(h/2)+' '+(w-26)+','+(h-1)+'" fill="'+color+'"/>'+
    '<circle cx="6" cy="'+(h/2)+'" r="6" fill="'+color+'"/>'+
    '<circle cx="6" cy="'+(h/2)+'" r="2.4" fill="rgba(255,255,255,.6)"/>');
}
/* 指針:整塊是正方形,針從正中央往右畫,所以旋轉中心剛好是軸心。
   只有最後那塊透明長條吃得到觸控(pointer-events),兩根針才不會互搶。 */
function drawHand(S,len,thick,color,grabFrom){
  const c=S/2;
  return wrapSvg(S,S,
    '<rect x="'+(c-len*0.15)+'" y="'+(c-thick/2)+'" width="'+(len*1.15)+'" height="'+thick+'" rx="'+(thick/2)+'" fill="'+color+'" pointer-events="none"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+(thick*0.75)+'" fill="'+color+'" pointer-events="none"/>'+
    '<rect x="'+(c+grabFrom)+'" y="'+(c-16)+'" width="'+(len-grabFrom+8)+'" height="32" fill="#000" opacity="0" pointer-events="all"/>');
}
function render(it){
  switch(it.type){
    case 'pencil': return drawPencil(it.w,it.h,it.color);
    case 'book':   return drawBook(it.w,it.h,it.color);
    case 'crayon': return drawCrayon(it.w,it.h,it.color);
    case 'sock':   return drawSock(it.w,it.h,it.color,it.pat);
    case 'star':   return drawStar(it.w,it.color);
    case 'shape':  return drawShape(it.kind,it.w,it.color);
    case 'chip':   return drawChip(it.w,it.h,it.color);
    case 'block':  return drawBlock(it.w,it.h,it.color);
    case 'frame':  return drawFrame(it.w,it.h,it.color);
    case 'arrow':  return drawArrow(it.w,it.h,it.color);
    case 'hand':   return drawHand(it.w,it.len,it.thick,it.color,it.grab);
  }
  return '';
}
function decorShape(kind,cx,cy,s,color){
  return '<g transform="translate('+(cx-s/2)+','+(cy-s/2)+')">'+shapeSvgBody(kind,s,color)+'</g>';
}
function note(txt,y){
  return '<text x="280" y="'+y+'" text-anchor="middle" font-size="12" fill="#9AA096" font-family="sans-serif">'+txt+'</text>';
}
function clockFace(cx,cy,r,label){
  let ticks='';
  for(let i=0;i<12;i++){
    const a=(i*30-90)*Math.PI/180, big=(i%3===0);
    const r1=r-(big?15:8), r2=r-4;
    ticks+='<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+
           '" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)+
           '" stroke="'+(big?'#8A9089':'#C2C6B8')+'" stroke-width="'+(big?3:2)+'" stroke-linecap="round"/>';
  }
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#FBF9F0" stroke="#C9C4AF" stroke-width="3"/>'+ticks+
    '<text x="'+cx+'" y="'+(cy+r+32)+'" text-anchor="middle" font-size="21" font-weight="700" fill="#2C3733" font-family="sans-serif">'+label+'</text>';
}

/* ================= 判斷小工具 ================= */
const inc=a=>a.every((v,i)=>i===0||v>a[i-1]);
const dec=a=>a.every((v,i)=>i===0||v<a[i-1]);
const allIdx=a=>a.map((_,i)=>i);
function angErr(rot,target,sym){
  sym=sym||360; let best=999;
  for(let a=target;a<target+359.9;a+=sym){
    const d=((rot-a)%360+540)%360-180;
    if(Math.abs(d)<Math.abs(best)) best=d;
  }
  return best;
}

/* ================= 二十一個關卡 ================= */
const LEVELS=[
{
  name:'鉛筆排排站', short:'把鉛筆靠左對齊', d:1,
  hint:'五支鉛筆都拖到虛線裡，左邊要對齊。順序隨你高興。',

/* ================= 狀態 ================= */
const board=document.getElementById('board'), stage=document.getElementById('stage');
const dotsEl=document.getElementById('dots'), toastEl=document.getElementById('toast');
let scale=1, cur=0, items=[], level=null, done=new Set(), solved=false, lastHot=null;

function layout(){
  scale=Math.min(stage.clientWidth/BW,1.2);
  board.style.transform='scale('+scale+')';
  stage.style.height=(BH*scale)+'px';
}
window.addEventListener('resize',layout);

/* ================= 位置與吸附 ================= */
function effW(it){ return (it.q%2)?it.h:it.w; }
function effH(it){ return (it.q%2)?it.w:it.h; }
function fits(s,it){
  if(s.fw==null) return true;
  return Math.abs(effW(it)-s.fw)<1.5 && Math.abs(effH(it)-s.fh)<1.5;
}
function slotTarget(s,it){
  const tx=s.align==='left'?s.x+8:s.x+(s.w-it.w)/2;
  const ty=s.valign==='bottom'?s.y+s.h-it.h:s.y+(s.h-it.h)/2;
  return {tx:tx,ty:ty};
}
function occupied(id){ return items.some(i=>i.slot===id); }
function placedCount(){ return items.filter(i=>i.slot||i.turned).length; }
function nearest(it){
  const lim=level.snap||72;
  let best=null,bd=1e9;
  for(let k=0;k<level.slots.length;k++){
    const s=level.slots[k];
    if(occupied(s.id)) continue;
    if(!fits(s,it)) continue;
    const t=slotTarget(s,it);
    const d=Math.hypot(it.x-t.tx,it.y-t.ty);
    if(d<bd){ bd=d; best={s:s,t:t,d:d}; }
  }
  return (best&&best.d<=lim)?best:null;
}

/* ================= 建關 ================= */
function build(idx){
  cur=idx; level=LEVELS[idx]; solved=false; lastHot=null;
  board.innerHTML='';
  const d=document.createElement('div');
  d.className='decor';
  d.innerHTML='<svg viewBox="0 0 '+BW+' '+BH+'" width="'+BW+'" height="'+BH+'">'+(level.decor||'')+'</svg>';
  board.appendChild(d);

  level.slots.forEach(function(s,i){
    s.id='s'+i;
    const el=document.createElement('div');
    el.className='slot'+(s.hidden?' hidden':'');
    el.style.cssText='left:'+s.x+'px;top:'+s.y+'px;width:'+s.w+'px;height:'+s.h+'px';
    s.el=el; board.appendChild(el);
  });

  items=level.items.map(function(src,i){
    const it=Object.assign({},src);
    it.id='i'+i; it.slot=null; it.turned=false;
    it.q=src.q0||0;
    if(level.spin) it.rot=it.q*90;
    if(it.rot==null) it.rot=0;
    const el=document.createElement('div');
    el.className='item'+(level.mode==='turn'?' turn':'')+(it.type==='hand'?' hand':'');
    el.style.zIndex=(it.type==='hand'&&it.thick<11)?3:2;
    el.innerHTML=render(it);
    it.el=el; move(it); bindDrag(it);
    board.appendChild(el);
    return it;
  });

  document.getElementById('lvName').textContent=(idx+1)+'. '+level.name;
  document.getElementById('lvDiff').textContent='★'.repeat(level.d)+'☆'.repeat(4-level.d);
  document.getElementById('lvHint').textContent=level.short;
  document.getElementById('prevBtn').disabled=idx===0;
  renderDots();
}
function move(it){
  it.el.style.transform='translate('+it.x+'px,'+it.y+'px) rotate('+(it.rot||0)+'deg)';
}
function capture(e,it){
  try{ e.target.setPointerCapture(e.pointerId); }
  catch(err){ try{ it.el.setPointerCapture(e.pointerId); }catch(e2){} }
}

/* ================= 互動 ================= */
let drag=null;
function bindDrag(it){
  /* --- 轉正型:左右拖曳 = 轉動,位置固定 --- */
  if(level.mode==='turn'){
    const TOL=it.tol||level.tol||5;
    it.el.addEventListener('pointerdown',function(e){
      if(solved) return;
      e.preventDefault(); unlock(); capture(e,it);
      it.el.classList.remove('snap'); it.el.classList.add('drag');
      it.turned=false; it._near=false;
      drag={it:it,sx:e.clientX,sr:it.rot};
      sfxPick();
    });
    it.el.addEventListener('pointermove',function(e){
      if(!drag||drag.it!==it) return;
      it.rot=drag.sr+(e.clientX-drag.sx)/scale*0.6;
      move(it);
      const near=Math.abs(angErr(it.rot,it.target,level.sym))<=TOL;
      if(near!==it._near){ it._near=near; if(near) sfxTick(); }
      it.el.classList.toggle('aligned',near);
    });
    const upT=function(){
      if(!drag||drag.it!==it) return;
      drag=null;
      it.el.classList.remove('drag');
      const err=angErr(it.rot,it.target,level.sym);
      if(Math.abs(err)<=TOL){
        it.rot=it.rot-err; it.turned=true;
        it.el.classList.add('snap','aligned'); move(it);
        sfxSnap(placedCount()-1);
      }else{
        it.el.classList.remove('aligned');
      }
      checkDone();
    };
    it.el.addEventListener('pointerup',upT);
    it.el.addEventListener('pointercancel',upT);
    return;
  }

  /* --- 一般型:拖曳搬動(拼合關卡另加:輕點 = 轉 90°) --- */
  it.el.addEventListener('pointerdown',function(e){
    if(solved) return;
    e.preventDefault(); unlock(); capture(e,it);
    const r=board.getBoundingClientRect();
    it.el.classList.remove('snap','wrong'); it.el.classList.add('drag');
    it.el.style.zIndex=50;
    if(!level.spin){ it.rot=0; move(it); }
    const had=!!it.slot;
    if(it.slot) it.slot=null;
    drag={it:it,dx:(e.clientX-r.left)/scale-it.x,dy:(e.clientY-r.top)/scale-it.y,
          r:r,sx:e.clientX,sy:e.clientY,moved:false,had:had};
    sfxPick();
  });
  it.el.addEventListener('pointermove',function(e){
    if(!drag||drag.it!==it) return;
    if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8) return;
    if(!drag.moved){ drag.moved=true; if(drag.had) sfxOut(); }
    const r=drag.r;
    it.x=Math.max(-12,Math.min(BW-it.w+12,(e.clientX-r.left)/scale-drag.dx));
    it.y=Math.max(-12,Math.min(BH-it.h+12,(e.clientY-r.top)/scale-drag.dy));
    move(it);
    const best=nearest(it);
    level.slots.forEach(s=>s.el.classList.toggle('hot',!!best&&s===best.s));
    const hotId=best?best.s.id:null;
    if(hotId!==lastHot){ lastHot=hotId; if(hotId) sfxTick(); }
  });
  const up=function(){
    if(!drag||drag.it!==it) return;
    const wasTap=!drag.moved;
    drag=null; lastHot=null;
    it.el.classList.remove('drag'); it.el.style.zIndex=2;
    level.slots.forEach(s=>s.el.classList.remove('hot'));
    if(wasTap && level.spin){
      it.q=(it.q+1)%4; it.rot=it.q*90;
      it.el.classList.add('snap'); move(it); sfxSpin();
    }
    const best=nearest(it);
    if(best){
      it.slot=best.s.id; it.x=best.t.tx; it.y=best.t.ty;
      it.el.classList.add('snap'); move(it);
      sfxSnap(placedCount()-1);
    }
    checkDone();
  };
  it.el.addEventListener('pointerup',up);
  it.el.addEventListener('pointercancel',up);
}

/* ================= 過關判定 ================= */
function checkDone(){
  if(level.mode==='turn'){
    if(items.every(i=>i.turned)) win();
    return;
  }
  const arr=level.slots.map(s=>items.find(i=>i.slot===s.id)||null);
  if(arr.some(x=>!x)) return;
  if(level.check(arr,level.slots)){ win(); return; }
  sfxNope();
  const badIdx=level.bad?level.bad(arr,level.slots):allIdx(arr);
  badIdx.forEach(function(k){
    const el=arr[k].el;
    el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
  });
  toast(level.fail||'全部放進去了，可是順序還差一點點…');
}
function win(){
  solved=true; done.add(cur); save(); renderDots();
  const all=done.size===LEVELS.length;
  if(all) sfxAll(); else sfxWin();
  const st=document.createElement('div');
  st.className='stamp'; st.textContent='整齊了';
  board.appendChild(st);
  requestAnimationFrame(()=>st.classList.add('on'));
  confetti(all?46:26);
  if(all) toast('二十一道整理全部完成，這裡乾淨得不像話 ✨');
}
function confetti(n){
  const cols=[C.rose,C.mustard,C.sage,C.sky,C.plum,C.pine];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='conf'; p.style.background=cols[i%cols.length];
    p.style.left=(BW/2-6+(Math.random()*2-1)*80)+'px';
    p.style.top=(BH/2)+'px';
    board.appendChild(p);
    const dx=(Math.random()*2-1)*240, dy=-90-Math.random()*130, rot=Math.random()*720-360;
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx+'px,'+(dy+320)+'px) rotate('+rot+'deg)',opacity:0}],
      {duration:1100+Math.random()*600,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove();
  }
}

/* ================= 介面 ================= */
function renderDots(){
  dotsEl.innerHTML='';
  LEVELS.forEach(function(L,i){
    const b=document.createElement('button');
    b.className='dot'+(i===cur?' now':'')+(done.has(i)?' ok':'')+(L.d===4?' hard':'');
    b.textContent=done.has(i)?'✓':(i+1);
    b.title=L.name+'（'+'★'.repeat(L.d)+'）';
    b.onclick=function(){ unlock(); sfxUi(); build(i); };
    dotsEl.appendChild(b);
  });
}
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('on'),3600);
}
document.getElementById('hintBtn').onclick=()=>{ unlock(); sfxUi(); toast(level.hint); };
document.getElementById('resetBtn').onclick=()=>{ unlock(); sfxUi(); build(cur); };
document.getElementById('prevBtn').onclick=()=>{ if(cur>0){ unlock(); sfxUi(); build(cur-1); } };
document.getElementById('nextBtn').onclick=()=>{ unlock(); sfxUi(); build((cur+1)%LEVELS.length); };
document.getElementById('sndBtn').onclick=function(e){
  soundOn=!soundOn; e.currentTarget.textContent=soundOn?'🔊':'🔇';
  if(soundOn){ unlock(); sfxUi(); }
};

/* ================= 進度(有就存,沒有就只留記憶體,完全不需要登入) ================= */
async function save(){
  try{ if(window.storage) await window.storage.set('tidy:progress',JSON.stringify(Array.from(done)),false); }catch(e){}
}
async function load(){
  try{
    if(window.storage){
      const r=await window.storage.get('tidy:progress',false);
      if(r&&r.value) done=new Set(JSON.parse(r.value));
    }
  }catch(e){}
  renderDots();
}

build(0); layout(); load();
</script>
